<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>WanderWell — travel that gives back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: hsl(40, 15%, 98%);
        --foreground: hsl(220, 18%, 12%);
        --muted-foreground: hsl(220, 9%, 46%);
        --card: hsl(0, 0%, 100%);
        --border: hsl(220, 14%, 92%);
        --secondary: hsl(40, 16%, 94%);
        --app-ink: hsl(220, 20%, 10%);
        --app-ink-soft: hsl(220, 16%, 22%);
        --app-sage: hsl(150, 30%, 26%);
        --app-sage-soft: hsl(150, 24%, 92%);
        --app-gold: hsl(38, 75%, 50%);
        --app-gold-soft: hsl(40, 80%, 94%);
        --app-line: hsl(220, 14%, 91%);
        --shell-max: 460px;
      }
      html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        letter-spacing: -0.005em;
        background:
          radial-gradient(900px 500px at 50% -200px, hsl(150 24% 94%) 0%, transparent 60%),
          var(--background);
        color: var(--foreground);
        margin: 0;
        min-height: 100vh;
        padding-bottom: 96px; /* room for fixed bottom nav */
      }
      .font-display {
        font-family: "Fraunces", "Inter", serif;
        font-feature-settings: "lnum", "tnum";
        letter-spacing: -0.02em;
      }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      .shadow-elev-1 {
        box-shadow: 0 1px 0 hsl(220 14% 92% / .6), 0 1px 2px hsl(220 20% 10% / .04), 0 4px 12px hsl(220 20% 10% / .04);
      }
      .shadow-ink {
        box-shadow: 0 8px 24px hsl(220 24% 8% / .18), 0 2px 6px hsl(220 24% 8% / .12);
      }
      .ring-hairline { box-shadow: inset 0 0 0 1px hsl(0 0% 100% / .08); }
      .lucide { stroke-width: 1.75; }

      /* — Layout — */
      .app-shell {
        max-width: var(--shell-max);
        margin: 0 auto;
        position: relative;
        min-height: 100vh;
      }
      .screen { min-height: 100vh; }
      .screen.hidden { display: none; }

      /* — Bottom nav (viewport-fixed, centered, matches shell width) — */
      .nav-bottom {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: var(--shell-max);
        background: hsl(0 0% 100% / .9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--app-line);
        padding: 8px 8px max(14px, env(safe-area-inset-bottom));
        z-index: 50;
      }
      .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 8px; color: hsl(220 9% 60%); transition: color .15s; background: transparent; border: none; cursor: pointer; }
      .nav-btn.active { color: var(--app-ink); }
      .nav-pill {
        display: flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 9999px;
        background: transparent; transition: background .2s;
      }
      .nav-btn.active .nav-pill { background: var(--app-sage-soft); }
      .nav-btn span:last-child { font-size: 10.5px; margin-top: 2px; font-weight: 500; }
      .nav-btn.active span:last-child { font-weight: 600; }

      /* — Avatar: initials sit BEHIND the image, not on top —
         The image is absolutely positioned and covers the whole avatar,
         so the initials only show when the image fails to load
         (its onerror handler removes the <img>). */
      .avatar {
        position: relative; overflow: hidden; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        color: white; font-weight: 600; user-select: none;
        border-radius: 9999px;
      }
      .avatar .initials {
        position: relative; z-index: 0;
        line-height: 1;
      }
      .avatar img {
        position: absolute; inset: 0; z-index: 1;
        width: 100%; height: 100%; object-fit: cover;
        background: transparent;
      }

      /* — Form controls — */
      .input {
        width: 100%; height: 48px; padding: 0 16px;
        border-radius: 16px;
        background: hsl(40 16% 94% / .7);
        border: 1px solid transparent;
        font-size: 14px; color: var(--foreground); font-family: inherit;
        transition: border-color .15s, background .15s;
      }
      .input:focus { outline: none; border-color: var(--app-sage); background: white; }
      .input::placeholder { color: hsl(220 9% 55%); }

      /* — Toast — */
      .toast {
        position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
        bottom: 110px; z-index: 70;
        background: var(--app-ink); color: white;
        padding: 12px 18px; border-radius: 9999px;
        font-size: 13px; font-weight: 500;
        box-shadow: 0 10px 25px hsl(220 24% 8% / .25);
        opacity: 0; pointer-events: none;
        transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);
        max-width: 90%;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* — FAB — */
      .fab {
        position: fixed; right: max(16px, calc(50vw - var(--shell-max)/2 + 16px));
        bottom: 96px; z-index: 40;
        width: 56px; height: 56px;
        border-radius: 9999px;
        background: var(--app-ink); color: white;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px hsl(220 24% 8% / .25), 0 2px 6px hsl(220 24% 8% / .15);
        border: none; cursor: pointer;
        transition: transform .15s;
      }
      .fab:hover { transform: scale(1.05); }
      .fab:active { transform: scale(0.95); }

      /* — Booking option card hover — */
      .option-card { transition: transform .15s, box-shadow .15s, border-color .15s; cursor: pointer; }
      .option-card:hover { transform: translateY(-1px); border-color: var(--app-sage); }
      .option-card:active { transform: translateY(0); }

      /* — Points pulse on award — */
      @keyframes pointspulse {
        0% { transform: scale(1); }
        40% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      .points-pulse { animation: pointspulse .55s cubic-bezier(.2,.8,.2,1); }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <main id="screens"></main>
    </div>

    <nav class="nav-bottom">
      <div class="flex items-stretch">
        <button class="nav-btn" data-go="home">
          <span class="nav-pill"><i data-lucide="home" class="w-[18px] h-[18px]"></i></span>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-go="book">
          <span class="nav-pill"><i data-lucide="ticket" class="w-[18px] h-[18px]"></i></span>
          <span>Book</span>
        </button>
        <button class="nav-btn" data-go="trips">
          <span class="nav-pill"><i data-lucide="route" class="w-[18px] h-[18px]"></i></span>
          <span>Trips</span>
        </button>
        <button class="nav-btn" data-go="discover">
          <span class="nav-pill"><i data-lucide="compass" class="w-[18px] h-[18px]"></i></span>
          <span>Discover</span>
        </button>
        <button class="nav-btn" data-go="profile">
          <span class="nav-pill"><i data-lucide="user" class="w-[18px] h-[18px]"></i></span>
          <span>Profile</span>
        </button>
      </div>
    </nav>

    <div id="toast" class="toast"></div>

    <script>
      /* ---------- 1. Data ---------- */

      // Modes used by historical "Log a trip" — kept for backward compatibility
      // with previously-saved trips. Booking uses BOOKING_MODES below.
      const TRANSPORT_MODES = {
        walking:         { name: "Walking",          icon: "🚶", carbonPerKm: 0    },
        cycling:         { name: "Cycling",          icon: "🚴", carbonPerKm: 0    },
        publicTransport: { name: "Public Transport", icon: "🚌", carbonPerKm: 0.05 },
        electricVehicle: { name: "Electric Vehicle", icon: "🔋", carbonPerKm: 0.02 },
        carpool:         { name: "Carpool",          icon: "🚗", carbonPerKm: 0.10 },
        airplane:        { name: "Airplane",         icon: "✈️", carbonPerKm: 0.25 },
      };
      const CAR_BASELINE = 0.21;
      const calcCarbonSaved = (mode, km) => {
        const m = TRANSPORT_MODES[mode] || BOOKING_MODES.find((x) => x.key === mode);
        const per = m ? (m.carbonPerKm ?? m.co2Per ?? 0) : 0;
        return Math.max(0, km * CAR_BASELINE - km * per);
      };

      const carbonMessage = (kg) => {
        if (kg >= 5)   return "Amazing — that's a real dent in your footprint.";
        if (kg >= 2)   return "Great work. Small choices, real difference.";
        if (kg >= 0.5) return "Nice — every km adds up.";
        return "Every sustainable choice matters.";
      };

      /* — Booking catalogue —
           co2Per:        kg CO₂e per passenger-km (DEFRA 2023 / IEA / Eurostar)
           pointsPerKm:   EcoPoints earned for that mode
           ecoScore:      0–100 sustainability score shown to the user
           pricePerKm:    rough USD per km used to estimate ticket price
           features:      bullet points shown on the booking option card        */
      const BOOKING_MODES = [
        { key: "walk",      name: "Walk",              icon: "🚶", co2Per: 0,     pointsPerKm: 60, ecoScore: 100, pricePerKm: 0,
          features: ["Zero emissions", "No ticket needed", "Get a little extra movement"] },
        { key: "bike",      name: "Bicycle",           icon: "🚴", co2Per: 0,     pointsPerKm: 55, ecoScore: 99, pricePerKm: 0,
          features: ["Zero emissions", "Free if you own a bike", "Often faster than a car in cities"] },
        { key: "ebike",     name: "E-Bike",            icon: "🚲", co2Per: 0.014, pointsPerKm: 45, ecoScore: 95, pricePerKm: 0.20,
          features: ["Battery powered, minimal CO₂", "Skip traffic and parking", "Available via Lime, Voi, Lyft and more"] },
        { key: "metro",     name: "Metro / Subway",    icon: "🚇", co2Per: 0.028, pointsPerKm: 35, ecoScore: 92, pricePerKm: 0.30,
          features: ["Electric, grid-powered", "Frequent service in city centres", "Often cheaper than driving"] },
        { key: "tram",      name: "Tram / Light Rail", icon: "🚊", co2Per: 0.029, pointsPerKm: 35, ecoScore: 92, pricePerKm: 0.25,
          features: ["Electric, grid-powered", "Step-free access at most stops", "Reduced carbon footprint compared to cars"] },
        { key: "bus",       name: "Bus / Coach",       icon: "🚌", co2Per: 0.027, pointsPerKm: 38, ecoScore: 88, pricePerKm: 0.12,
          features: ["Multiple departure times daily", "Comfortable seating with extra legroom", "Reduced carbon footprint compared to cars"] },
        { key: "hsRail",    name: "High-Speed Rail",   icon: "🚄", co2Per: 0.006, pointsPerKm: 55, ecoScore: 97, pricePerKm: 0.25,
          features: ["Direct connection available", "Wi-Fi and power outlets on board", "Carbon offset included with eco ticket"] },
        { key: "train",     name: "Regional Train",    icon: "🚆", co2Per: 0.035, pointsPerKm: 40, ecoScore: 88, pricePerKm: 0.18,
          features: ["Up to 90% less CO₂ than flying", "City-centre to city-centre, no transfers", "Easy walk-on with luggage"] },
        { key: "ferry",     name: "Ferry",             icon: "⛴️",  co2Per: 0.019, pointsPerKm: 30, ecoScore: 86, pricePerKm: 0.30,
          features: ["Foot-passenger fares", "Sea views, cabin space", "Scenic, sociable journey"] },
        { key: "ev",        name: "Electric Car",      icon: "🔋", co2Per: 0.047, pointsPerKm: 22, ecoScore: 80, pricePerKm: 0.15,
          features: ["Zero tailpipe emissions", "Fast-charge network expanding", "Quiet, smooth ride"] },
        { key: "carpool",   name: "Rideshare / Carpool", icon: "🚗", co2Per: 0.043, pointsPerKm: 18, ecoScore: 78, pricePerKm: 0.10,
          features: ["Connect with other travelers", "Split the cost of fuel", "Lower emissions than driving alone"] },
        { key: "flightSaf", name: "Flight — SAF",      icon: "✈️", co2Per: 0.075, pointsPerKm: 8,  ecoScore: 65, pricePerKm: 0.28,
          features: ["Sustainable Aviation Fuel — up to 70% less CO₂", "Same schedule as a regular flight", "Some airlines opt in at booking"] },
        { key: "flight",    name: "Flight",            icon: "✈️", co2Per: 0.155, pointsPerKm: 0,  ecoScore: 45, pricePerKm: 0.18,
          features: ["Fastest option for long-haul", "Widest schedule", "Highest carbon footprint of the options"] },
      ];

      /* — Eco Score → label + colour bucket — */
      function ecoBadge(score) {
        if (score >= 90) return { label: "Excellent", color: "var(--app-sage)",  bg: "var(--app-sage-soft)" };
        if (score >= 80) return { label: "Great",     color: "hsl(82 50% 32%)",  bg: "hsl(82 50% 95%)" };
        if (score >= 65) return { label: "Good",      color: "hsl(40 70% 32%)",  bg: "hsl(40 80% 94%)" };
        return            { label: "Carbon-heavy",   color: "hsl(15 65% 38%)",  bg: "hsl(15 70% 95%)" };
      }
      /* — % less CO₂ than flying (standard jet), for the prototype's caption — */
      function lessThanFlying(co2Per) {
        const flight = 0.155;
        return Math.max(0, Math.round((1 - co2Per / flight) * 100));
      }
      /* — Format USD price — */
      function formatPrice(usd) {
        if (usd === 0) return "Free";
        if (usd < 10) return `$${usd.toFixed(2)}`;
        return `$${Math.round(usd)}`;
      }

      const byKey = (k) => BOOKING_MODES.find((m) => m.key === k);

        { id: "zurich",     name: "Zurich",        country: "Switzerland",    lat: 47.3769,  lng: 8.5417  },

        { id: "venice",     name: "Venice",        country: "Italy",          lat: 45.4408,  lng: 12.3155 },
        // Northern Europe
        { id: "copenhagen", name: "Copenhagen",    country: "Denmark",        lat: 55.6761,  lng: 12.5683 },
        { id: "stockholm",  name: "Stockholm",     country: "Sweden",         lat: 59.3293,  lng: 18.0686 },

        { id: "nyc",        name: "New York",      country: "USA",            lat: 40.7128,  lng: -74.0060 },
        { id: "boston",     name: "Boston",        country: "USA",            lat: 42.3601,  lng: -71.0589 },
        { id: "washington", name: "Washington DC", country: "USA",            lat: 38.9072,  lng: -77.0369 },

        { id: "sf",         name: "San Francisco", country: "USA",            lat: 37.7749,  lng: -122.4194 },
        { id: "la",         name: "Los Angeles",   country: "USA",            lat: 34.0522,  lng: -118.2437 },
        { id: "toronto",    name: "Toronto",       country: "Canada",         lat: 43.6532,  lng: -79.3832 },
        // Asia–Pacific
        { id: "tokyo",      name: "Tokyo",         country: "Japan",          lat: 35.6762,  lng: 139.6503 },

        { id: "seoul",      name: "Seoul",         country: "South Korea",    lat: 37.5665,  lng: 126.9780 },
        { id: "beijing",    name: "Beijing",       country: "China",          lat: 39.9042,  lng: 116.4074 },
        { id: "shanghai",   name: "Shanghai",      country: "China",          lat: 31.2304,  lng: 121.4737 },

        { id: "singapore",  name: "Singapore",     country: "Singapore",      lat: 1.3521,   lng: 103.8198 },
        { id: "bangkok",    name: "Bangkok",       country: "Thailand",       lat: 13.7563,  lng: 100.5018 },
        { id: "sydney",     name: "Sydney",        country: "Australia",      lat: -33.8688, lng: 151.2093 },
        { id: "melbourne",  name: "Melbourne",     country: "Australia",      lat: -37.8136, lng: 144.9631 },
        { id: "auckland",   name: "Auckland",      country: "New Zealand",    lat: -36.8485, lng: 174.7633 },
      ];

      const cityLabel = (c) => `${c.name}, ${c.country}`;
      const cityById = (id) => CITIES.find((c) => c.id === id);
      const cityByLabel = (label) =>
        CITIES.find((c) => cityLabel(c).toLowerCase() === (label || "").toLowerCase());

      /* — Known intercity rail corridors. Service name + a multiplier converting
           great-circle distance to the actual track distance (rail is rarely
           straight). — */
      const RAIL_CORRIDORS = {
        // Eurostar / Thalys / Channel
        "london|paris":      { service: "Eurostar",            kind: "hsRail", railFactor: 1.06, durationH: 2.4 },

        // Germany / Austria / Switzerland
        "berlin|munich":     { service: "ICE Sprinter",        kind: "hsRail", railFactor: 1.15, durationH: 4.0 },

        "frankfurt|berlin":  { service: "ICE",                 kind: "hsRail", railFactor: 1.15, durationH: 4.0 },
        "frankfurt|munich":  { service: "ICE",                 kind: "hsRail", railFactor: 1.10, durationH: 3.2 },
        "munich|vienna":     { service: "Railjet",             kind: "hsRail", railFactor: 1.10, durationH: 4.0 },
        "zurich|munich":     { service: "EuroCity",            kind: "train",  railFactor: 1.10, durationH: 3.5 },
        "vienna|berlin":     { service: "ÖBB Nightjet",        kind: "train",  railFactor: 1.15, durationH: 9.5 },
        // Spain / Italy
        "madrid|barcelona":  { service: "AVE",                 kind: "hsRail", railFactor: 1.05, durationH: 2.5 },
        "madrid|seville":    { service: "AVE",                 kind: "hsRail", railFactor: 1.05, durationH: 2.5 },
        "rome|milan":        { service: "Frecciarossa",        kind: "hsRail", railFactor: 1.05, durationH: 3.0 },
        "milan|venice":      { service: "Frecciarossa",        kind: "hsRail", railFactor: 1.06, durationH: 2.3 },
        // UK domestic
        "london|edinburgh":  { service: "LNER",                kind: "train",  railFactor: 1.08, durationH: 4.3 },
        "london|manchester": { service: "Avanti West Coast",   kind: "train",  railFactor: 1.08, durationH: 2.2 },
        // North America
        "nyc|washington":    { service: "Amtrak Acela",        kind: "hsRail", railFactor: 1.08, durationH: 2.8 },
        "nyc|boston":        { service: "Amtrak Acela",        kind: "hsRail", railFactor: 1.10, durationH: 3.6 },
        // Asia
        "tokyo|osaka":       { service: "Tōkaidō Shinkansen", kind: "hsRail", railFactor: 1.06, durationH: 2.5 },
        "tokyo|kyoto":       { service: "Tōkaidō Shinkansen", kind: "hsRail", railFactor: 1.06, durationH: 2.2 },
        "osaka|kyoto":       { service: "Shinkansen",          kind: "hsRail", railFactor: 1.05, durationH: 0.3 },
        "shanghai|beijing":  { service: "CR400 Fuxing",        kind: "hsRail", railFactor: 1.06, durationH: 4.5 },
        "seoul|busan":       { service: "KTX",                 kind: "hsRail", railFactor: 1.06, durationH: 2.5 },
        // Oceania
        "sydney|melbourne":  { service: "XPT",                 kind: "train",  railFactor: 1.10, durationH: 11.0 },
      };

      function corridorFor(aId, bId) {
        return RAIL_CORRIDORS[`${aId}|${bId}`] || RAIL_CORRIDORS[`${bId}|${aId}`] || null;
      }

      /* — Haversine great-circle distance, km — */
      function haversineKm(a, b) {
        const R = 6371;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const x =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }

      /* — Same country detection (for "intercontinental" filtering) — */
      const SAME_REGION = {
        Europe: ["United Kingdom","Ireland","France","Belgium","Netherlands","Germany","Switzerland","Austria","Spain","Portugal","Italy","Denmark","Sweden","Norway"],
        NorthAmerica: ["USA","Canada"],
        EastAsia: ["Japan","South Korea","China","Hong Kong"],
        SEAsia: ["Singapore","Thailand"],
        Oceania: ["Australia","New Zealand"],
      };
      function regionOf(country) {
        for (const r of Object.keys(SAME_REGION)) if (SAME_REGION[r].includes(country)) return r;
        return "Other";
      }
      const sameRegion = (a, b) => regionOf(a.country) === regionOf(b.country);

      /* — Pick the realistic transport options for a given (from, to). Returns
           the BOOKING_MODES entries with computed CO₂, points, and (when
           applicable) the real service brand & duration. — */
      function optionsForRoute(from, to) {
        if (!from || !to || from.id === to.id) return null;
        const greatCircle = haversineKm(from, to);
        const corridor = corridorFor(from.id, to.id);
        const sameContinent = sameRegion(from, to);

        const include = [];
        const push = (key, overrides = {}) => include.push({ key, ...overrides });

        // Local urban moves
        if (greatCircle <= 5)  push("walk");
        if (greatCircle <= 25) push("bike");
        if (greatCircle <= 40) push("ebike");
        if (greatCircle <= 35) push("metro");
        if (greatCircle <= 35) push("tram");

        // Long-distance surface — same continent only
        if (sameContinent && greatCircle >= 10 && greatCircle <= 1500) push("bus");

        if (sameContinent) {
          if (corridor) {
            // Real-world named service for this pair
            push(corridor.kind, {
              service: corridor.service,
              durationH: corridor.durationH,
              railFactor: corridor.railFactor,
            });
          } else {
            // No named corridor — offer generic regional train when plausible
            if (greatCircle >= 30 && greatCircle <= 1500) push("train");
            // Only offer HSR when no corridor info and a plausible HSR distance
            if (greatCircle >= 200 && greatCircle <= 1500) push("hsRail");
          }
        }

        if (sameContinent && greatCircle >= 5 && greatCircle <= 1200) push("ev");
        if (sameContinent && greatCircle >= 5 && greatCircle <= 1200) push("carpool");

        // Ferry: a couple of well-known passenger routes
        const ferryKeys = ["dublin|london","dublin|manchester","dublin|edinburgh"];
        const pairA = `${from.id}|${to.id}`, pairB = `${to.id}|${from.id}`;
        if (ferryKeys.includes(pairA) || ferryKeys.includes(pairB)) push("ferry");

        // Flights
        if (greatCircle >= 300) push("flightSaf");
        if (greatCircle >= 250) push("flight");

        const seen = new Set();
        const dedup = include.filter((c) => (seen.has(c.key) ? false : seen.add(c.key)));

        const computed = dedup
          .filter((c) => byKey(c.key))
          .map((c) => {
            const base = byKey(c.key);
            // Ground modes use route-network distance, flights use great-circle.
            const groundFactor =
              c.railFactor ||
              ({ hsRail: 1.08, train: 1.15, bus: 1.18, ev: 1.25, carpool: 1.25, ferry: 1.10 }[c.key] || 1);
            const isGround = ["bus","train","hsRail","ev","carpool","ferry"].includes(c.key);
            const km = isGround ? greatCircle * groundFactor : greatCircle;
            const co2 = +(km * base.co2Per).toFixed(2);
            const points = Math.round(km * base.pointsPerKm);
            const price = base.pricePerKm === 0 ? 0 : km * base.pricePerKm;
            return {
              ...base,
              key: c.key,
              service: c.service || null,
              durationH: c.durationH || null,
              km: +km.toFixed(1),
              co2,
              points,
              price: +price.toFixed(2),
              lessFlying: lessThanFlying(base.co2Per),
            };
          });

        // "Saved vs …" compares to the WORST option in this route's own list,
        // not to a generic car. For flights that means comparing to standard
        // jet-fuel; for local trips it's whatever the dirtiest realistic
        // alternative is. (Per the rule: always compare to the least
        // sustainable option that's actually available for the route.)
        const worst = computed.reduce((w, o) => (o.co2 > w.co2 ? o : w), computed[0] || { co2: 0 });
        computed.forEach((o) => {
          o.savedVs = +Math.max(0, worst.co2 - o.co2).toFixed(2);
          o.comparedTo = worst.service ? `${worst.name} (${worst.service})` : worst.name;
        });

        return computed.sort((a, b) => a.co2 - b.co2 || b.points - a.points);
      }

          const options = (from && to && from.id !== to.id) ? optionsForRoute(from, to) : null;

          const corridor = (from && to) ? corridorFor(from.id, to.id) : null;

          const optionsHtml = options && options.length
            ? options.map((o, i) => bookingOptionCard(o, i === 0, from, to)).join("")

          const popularChips = POPULAR_ROUTES.map((r) => {
            const a = cityById(r.from), b = cityById(r.to);
            if (!a || !b) return "";
            const corr = corridorFor(a.id, b.id);
            const label = `${a.name} → ${b.name}`;
            const sub = corr ? `via ${corr.service}` : `${Math.round(haversineKm(a, b))} km`;
            return `

                  <span class="px-2 py-1 rounded-full text-white" style="background:var(--app-sage)">Eco Score 90+</span>

                  <span class="px-2 py-1 rounded-full text-white" style="background:hsl(40 70% 45%)">&lt;85</span>

        trips() {
          const upcoming = [...state.bookings].sort((a,b) => +new Date(a.when) - +new Date(b.when));
          const sortedTrips = [...state.trips].sort((a,b) => +new Date(b.date) - +new Date(a.date));

          let body = "";
          if (upcoming.length) {
            body += `
              <section class="mb-7">
                <div class="flex items-baseline justify-between mb-3">
                  <h2 class="text-[15px] font-semibold tracking-tight">Upcoming</h2>
                  <span class="text-[11px] text-[color:var(--muted-foreground)] tabular-nums">${upcoming.length} booked</span>
                </div>
                <div class="space-y-2">${upcoming.map(bookingRow).join("")}</div>
              </section>
            `;
          }

          if (!sortedTrips.length) {
            body += `
              <div class="text-center py-10">
                <div class="text-5xl mb-4">🌱</div>
                <h3 class="text-[15px] font-semibold mb-1">No past trips yet</h3>

                </div>
              </div>
            `;
          } else {
            // Group past trips by day
            const groups = {};
            for (const t of sortedTrips) {
              const k = new Date(t.date).toDateString();
              (groups[k] = groups[k] || []).push(t);
            }
            const dayKeys = Object.keys(groups).sort((a,b) => +new Date(b) - +new Date(a));
            const groupedHtml = dayKeys.map((k) => {
              const dayTrips = groups[k];
              const dayCarbon = dayTrips.reduce((s, t) => s + calcCarbonSaved(t.mode, t.km), 0);
              return `
                <div class="mb-6">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-[color:var(--muted-foreground)]"></i>

                  <div class="space-y-2">${dayTrips.map(tripRow).join("")}</div>
                </div>

            body += `

                ${groupedHtml}
              </section>
            `;
          }

          return `

              ${tripsHeader(sortedTrips)}
              <main class="px-5 py-6 text-left">${body}</main>
            </section>
          `;

                    <p class="text-[12px] uppercase tracking-wider font-semibold mt-3" style="color:var(--app-sage)">Estimated carbon saved</p>
                    <p class="text-[13px] opacity-70 mt-2 max-w-[280px] mx-auto">${carbonMessage(carbon)}</p>

        rewards() {

          const list = filter === "all" ? REWARDS : REWARDS.filter((r) => r.category === filter);

          return `
            <section class="screen" data-name="rewards">

        share() {
          // Composer either pulled from a recent trip/booking or blank
          if (!window._shareForm) {

              location: trip ? `${trip.from} → ${trip.to}` : "",
              body: trip

                    <div class="grid grid-cols-2 gap-2">
                      <div class="rounded-xl bg-secondary/60 p-3 text-center">
                        <div class="text-[11px] text-[color:var(--muted-foreground)] uppercase tracking-wider">CO₂ saved</div>
                        <div class="font-display text-[18px] tabular-nums mt-1">${saved.toFixed(1)} <span class="text-xs text-[color:var(--muted-foreground)]">kg</span></div>

      /* ---------- 5. Components ---------- */

      function postCard(post) {
        const u = Object.values(USERS).find((x) => x.id === post.userId);
        const trip = post.tripId ? state.trips.find((t) => t.id === post.tripId) : null;

        // Derive Eco Score from the trip's mode, or fall back to a stored value
        let score = post.ecoScore;
        let saved = 0;
        let typicalCo2 = 0;
        if (trip) {
          const co2Per = TRANSPORT_MODES[trip.mode]?.carbonPerKm ?? 0;
          score = Math.round(100 - (co2Per / 0.155) * 55);
          saved = calcCarbonSaved(trip.mode, trip.km);
          // "Typical trip" = standard flight for long, car for short
          typicalCo2 = trip.km >= 250
            ? trip.km * 0.155
            : trip.km * 1.25 * 0.171;
        }
        const badge = score != null ? ecoBadge(score) : null;

        const carbonSavedBlock = trip && typicalCo2 > 0 ? `
          <div class="border rounded-2xl p-3 mb-3" style="background:hsl(40 16% 94% / .6); border-color:var(--app-line)">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] uppercase tracking-wider text-[color:var(--muted-foreground)] font-semibold">Carbon Saved</span>
              <span class="text-[12px] font-semibold tabular-nums" style="color:var(--app-sage)">
                ${(typicalCo2 - saved).toFixed(0)} kg CO₂
                (${Math.round(((typicalCo2 - saved) / typicalCo2) * 100)}% less)
              </span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[11px]">
              <div class="rounded-xl p-2.5 bg-white border border-[color:var(--app-line)]">

                  <i data-lucide="leaf" class="w-3 h-3"></i> Your trip
                </div>
                <div class="mt-1 font-display text-[16px] tabular-nums">${(trip.km * (TRANSPORT_MODES[trip.mode]?.carbonPerKm || 0)).toFixed(0)} <span class="text-[10px] text-[color:var(--muted-foreground)]">kg CO₂</span></div>
                <div class="text-[10.5px] text-[color:var(--muted-foreground)] mt-0.5">${TRANSPORT_MODES[trip.mode]?.name || "Sustainable"}</div>
              </div>
              <div class="rounded-xl p-2.5 bg-white border border-[color:var(--app-line)]">
                <div class="flex items-center gap-1 text-[color:hsl(15_65%_45%)] font-semibold">
                  <i data-lucide="trending-up" class="w-3 h-3"></i> Typical trip
                </div>
                <div class="mt-1 font-display text-[16px] tabular-nums">${typicalCo2.toFixed(0)} <span class="text-[10px] text-[color:var(--muted-foreground)]">kg CO₂</span></div>

              </div>
            </div>
          </div>` : "";

        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-4">
            <div class="flex items-start justify-between gap-3 mb-2">
              <div class="flex items-start gap-3 min-w-0">
                ${avatarHtml(u, 40)}

                  <div class="font-semibold text-[14px] truncate">${u.displayName}</div>

                    ${trip ? `<i data-lucide="map-pin" class="w-3 h-3 shrink-0"></i><span class="truncate">${trip.from} → ${trip.to}</span><span>·</span>` : ""}
                    <span>${formatTimeAgo(post.when)}</span>
                  </div>
                </div>
              </div>
              ${badge ? `
                <span class="shrink-0 inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold"
                      style="background:${badge.bg}; color:${badge.color}">
                  <span class="uppercase tracking-wider text-[9.5px]">Eco Score:</span> ${score}
                </span>` : ""}
            </div>

            <p class="text-[14.5px] leading-relaxed mb-3 text-left">${post.body}</p>

            ${post.photo ? `<div class="rounded-2xl overflow-hidden mb-3 bg-secondary aspect-[4/3] flex items-center justify-center text-[color:var(--muted-foreground)]"><i data-lucide="image" class="w-8 h-8"></i></div>` : ""}

            ${carbonSavedBlock}

            <button class="like-btn inline-flex items-center gap-1.5 ${post.liked ? "text-rose-500" : "text-[color:var(--muted-foreground)]"}" data-post="${post.id}">
              <i data-lucide="heart" class="w-4 h-4 ${post.liked ? "fill-current" : ""}"></i>
              <span class="text-xs tabular-nums">${post.likeCount}</span>

      /* — Decorative world map with eco-score dots. Pure SVG, no tiles. — */
      function worldMapSvg() {
        // A handful of fake post pins — colours match the eco-score legend.
        const pins = [
          { x: 26, y: 32, score: "high" },   // London
          { x: 28, y: 35, score: "high" },   // Paris
          { x: 32, y: 42, score: "mid"  },   // Rome
          { x: 73, y: 38, score: "high" },   // Tokyo
          { x: 70, y: 44, score: "mid"  },   // Hong Kong

          { x: 12, y: 44, score: "mid"  },   // West Coast
          { x: 81, y: 70, score: "high" },   // Sydney

        const colorFor = (s) => s === "high" ? "var(--app-sage)" : s === "mid" ? "hsl(82 50% 38%)" : "hsl(40 70% 45%)";
        return `
          <svg viewBox="0 0 100 56" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"

              <path d="M10 38 q2 6 10 8 q6 4 12 0 q4 2 -2 8 q-12 6 -18 -4 q-4 -6 -2 -12z"/>
              <path d="M30 22 q8 -6 20 -2 q14 0 22 6 q6 6 -4 10 q-12 4 -24 0 q-18 -2 -14 -14z"/>
              <path d="M40 40 q6 -2 14 2 q8 4 4 10 q-10 4 -18 -2 q-4 -4 0 -10z"/>

              <path d="M70 46 q10 -4 18 2 q4 6 -6 8 q-12 0 -16 -4 q-2 -4 4 -6z"/>

            <!-- Pins -->

      function howPointsWorkCard() {
        return `

              <span>🚲 E-bike</span>          <span class="text-right tabular-nums font-semibold">45 / km</span>
              <span>🚆 Regional train</span>  <span class="text-right tabular-nums font-semibold">40 / km</span>

              <span>🚇 Metro / tram</span>    <span class="text-right tabular-nums font-semibold">35 / km</span>
              <span>🔋 Electric car</span>    <span class="text-right tabular-nums font-semibold">22 / km</span>
              <span>🚗 Carpool</span>         <span class="text-right tabular-nums font-semibold">18 / km</span>

      function rewardCard(r) {
        const claimed = state.redemptions.some((x) => x.rewardId === r.id);
        const cant = state.points < r.cost;
        const blocked = (claimed && !r.repeatable) || cant;
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 overflow-hidden">

              <div class="w-20 flex items-center justify-center text-4xl shrink-0" style="background:${r.gradient}">${r.icon}</div>
              <div class="flex-1 p-4 min-w-0">

                  <div class="min-w-0">
                    <p class="text-[10px] uppercase tracking-wider text-[color:var(--muted-foreground)]">${r.partner}</p>
                    <h3 class="font-semibold text-[14.5px] leading-tight truncate">${r.name}</h3>
                  </div>
                  <div class="flex items-center gap-1 px-2.5 py-1 rounded-full shrink-0"
                       style="background:var(--app-gold-soft)">
                    <i data-lucide="award" class="w-3.5 h-3.5" style="color:var(--app-gold)"></i>
                    <span class="font-semibold tabular-nums text-[12px]" style="color:hsl(38 60% 25%)">${formatPoints(r.cost)}</span>
                  </div>
                </div>
                <p class="text-[12px] text-[color:var(--muted-foreground)] leading-snug mb-3">${r.description}</p>
                <button class="redeem-btn text-[12.5px] font-medium px-3.5 py-1.5 rounded-full
                              ${blocked
                                ? "bg-[color:var(--secondary)] text-[color:var(--muted-foreground)] cursor-not-allowed"
                                : "bg-[color:var(--app-ink)] text-white hover:bg-[color:var(--app-ink-soft)]"}"
                        data-reward="${r.id}" ${blocked ? "disabled" : ""}>
                  ${claimed && !r.repeatable
                    ? "Claimed"
                    : (cant ? `Need ${formatPoints(r.cost - state.points)} more` : "Redeem")}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function redemptionRow(red) {
        const r = rewardById(red.rewardId);
        if (!r) return "";
        return `
          <div class="flex items-center gap-3 p-3 rounded-xl bg-secondary/60">
            <div class="text-xl">${r.icon}</div>
            <div class="flex-1 min-w-0">
              <div class="text-[13px] font-medium truncate">${r.name}</div>
              <div class="text-[11px] text-[color:var(--muted-foreground)]">${r.partner} · ${formatTimeAgo(red.when)}</div>
            </div>
            <span class="text-[11px] text-[color:var(--muted-foreground)] tabular-nums">−${formatPoints(red.cost)}</span>
          </div>
        `;
      }

      function tripRow(trip) {
        const m = TRANSPORT_MODES[trip.mode] || BOOKING_MODES.find((x) => x.key === trip.mode) || { icon: "🚗", name: trip.mode };
        const saved = calcCarbonSaved(trip.mode, trip.km);
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-3.5">
            <div class="flex items-center gap-3 text-left">
              <div class="w-11 h-11 rounded-xl bg-[color:var(--secondary)] flex items-center justify-center text-lg shrink-0">${m.icon}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="font-medium text-[14px] truncate">${trip.from} → ${trip.to}</span>
                  <span class="text-[11px] text-[color:var(--muted-foreground)] shrink-0">${formatTimeAgo(trip.date)}</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-[color:var(--muted-foreground)] tabular-nums">
                  <span>${trip.km.toFixed(1)} km</span><span>·</span>
                  <span class="font-semibold" style="color:var(--app-sage)">−${saved.toFixed(1)} kg CO₂</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function bookingRow(b) {
        const m = BOOKING_MODES.find((x) => x.key === b.mode) || { icon: "🎫", name: b.mode };
        const serviceLine = b.service ? `${m.name} · ${b.service}` : m.name;
        const dur = b.durationH ? formatHours(b.durationH) : null;
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-3.5">
            <div class="flex items-center gap-3 text-left">
              <div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0"
                   style="background:var(--app-sage-soft)">${m.icon}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="font-medium text-[14px] truncate">${b.from} → ${b.to}</span>
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full shrink-0"
                        style="background:var(--app-gold-soft); color:hsl(38 60% 25%)">+${formatPoints(b.points)} pts</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-[color:var(--muted-foreground)] tabular-nums flex-wrap">
                  <span class="truncate">${serviceLine}</span><span>·</span>
                  <span>${Math.round(b.km)} km</span>
                  ${dur ? `<span>·</span><span>${dur}</span>` : ""}
                  <span>·</span>
                  <span class="font-medium">${formatFutureDate(b.when)}</span>
                </div>
              </div>
              <button class="cancel-booking text-[color:var(--muted-foreground)] hover:text-rose-500 p-1.5 rounded-lg" data-booking="${b.id}" title="Cancel">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }

      function bookingOptionCard(o, isBest, fromCity, toCity) {
        const dur = o.durationH || estimateDuration(o.key, o.km);
        const durStr = dur ? formatHours(dur) : "—";
        const badge = ecoBadge(o.ecoScore);
        const title = o.service ? `${o.name} · ${o.service}` : o.name;
        const priceStr = formatPrice(o.price);
        const lessFlying = o.lessFlying;
        const isWorst = (o.savedVs ?? 0) === 0;
        const savedLine = !isWorst && o.savedVs > 0
          ? `<p class="text-[11.5px] mt-1.5 font-medium" style="color:var(--app-sage)">−${o.savedVs.toFixed(1)} kg vs ${o.comparedTo || "least sustainable"}</p>`
          : "";
        return `
          <div class="option-card book-option bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-4"
               data-mode="${o.key}">
            <!-- Top row: icon + title + price -->
            <div class="flex items-start gap-3 mb-2">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0"
                   style="background:${isBest ? badge.bg : 'var(--secondary)'}">${o.icon}</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-[15px] truncate">${title}</div>
                <div class="text-[12px] text-[color:var(--muted-foreground)] tabular-nums mt-0.5">
                  ${durStr} · ${o.co2 === 0 ? "Zero" : o.co2.toFixed(1) + " kg"} CO₂
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full mb-1"
                     style="background:${badge.bg}; color:${badge.color}">
                  <span class="text-[10px] uppercase tracking-wider font-semibold">Eco Score:</span>
                  <span class="text-[12px] font-bold tabular-nums">${o.ecoScore}</span>
                </div>
                <div class="font-semibold text-[15px] tabular-nums">${priceStr}</div>
              </div>
            </div>

            <!-- Less-than-flying caption -->
            ${lessFlying >= 50 ? `
              <p class="text-[11.5px] mb-2 font-medium" style="color:var(--app-sage)">
                ${lessFlying}% less CO₂ than flying
              </p>
            ` : ""}

            <!-- Feature bullets -->
            ${o.features?.length ? `
              <ul class="space-y-1 mb-3">
                ${o.features.slice(0, 3).map(f => `
                  <li class="flex items-start gap-2 text-[12.5px] text-foreground/80">
                    <i data-lucide="check" class="w-3.5 h-3.5 mt-0.5 shrink-0" style="color:var(--app-sage)"></i>
                    <span>${f}</span>
                  </li>
                `).join("")}
              </ul>
            ` : ""}

            <!-- Footer: points reward + saved -->
            <div class="flex items-end justify-between gap-2 pt-2 border-t border-[color:var(--app-line)]">
              <div>
                ${isBest ? `<span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-full"
                  style="background:var(--app-sage); color:white">Best for the planet</span>` : ""}
                ${savedLine}
              </div>
              <div class="text-right">
                <div class="flex items-center gap-1 px-2.5 py-1 rounded-full"
                     style="background:var(--app-gold-soft)">
                  <i data-lucide="award" class="w-3.5 h-3.5" style="color:var(--app-gold)"></i>
                  <span class="font-semibold tabular-nums text-[12px]" style="color:hsl(38 60% 25%)">+${formatPoints(o.points)} pts</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function emptyState(title, caption) {
        return `
          <div class="text-center py-10 rounded-2xl border border-dashed border-[color:var(--app-line)]"
               style="background:hsl(40 16% 96% / .6)">
            <div class="text-3xl mb-2">🌍</div>
            <p class="text-sm font-medium">${title}</p>
            <p class="text-xs text-[color:var(--muted-foreground)] mt-1 max-w-[260px] mx-auto">${caption}</p>
          </div>
        `;
      }

      // Mode-based average speeds (km/h)
      function estimateDuration(key, km) {
        const speeds = {
          walk: 5, bike: 16, ebike: 22, metro: 30, tram: 25,
          bus: 55, train: 90, hsRail: 220, ferry: 30,
          ev: 90, carpool: 90, flightSaf: 750, flight: 750,
        };
        if (!speeds[key] || !km) return null;
        // Add a small fixed overhead for flights (security, boarding)
        const overhead = key === "flight" || key === "flightSaf" ? 2.5 : 0;
        return km / speeds[key] + overhead;
      }

      function formatHours(h) {
        if (h < 1) return `${Math.round(h * 60)} min`;
        const whole = Math.floor(h);
        const mins = Math.round((h - whole) * 60);
        return mins === 0 ? `${whole} h` : `${whole} h ${mins} m`;
      }

      function statTile(icon, value, label) {
        return `
          <div class="rounded-2xl bg-white border border-[color:var(--app-line)] shadow-elev-1 p-3 text-left">
            <div class="w-7 h-7 rounded-lg bg-[color:var(--secondary)] flex items-center justify-center text-[color:var(--muted-foreground)] mb-2">
              <i data-lucide="${icon}" class="w-4 h-4"></i>
            </div>
            <div class="font-display text-lg leading-none tabular-nums">${value}</div>
            <div class="text-[10.5px] uppercase tracking-wider text-[color:var(--muted-foreground)] mt-1">${label}</div>
          </div>
        `;
      }

      function statPill(value, label) {
        return `
          <div class="rounded-2xl bg-white/10 px-2 py-3">
            <div class="font-display text-[20px] leading-none tabular-nums">${value}</div>
            <div class="text-[10px] uppercase tracking-wider text-white/65 mt-1.5">${label}</div>
          </div>
        `;
      }

      function progressRing(pct, size = 120) {
        const r = (size - 12) / 2;
        const c = 2 * Math.PI * r;
        const dash = (pct / 100) * c;
        return `
          <div class="flex items-center justify-center mb-6">
            <div class="relative" style="width:${size}px;height:${size}px">
              <svg width="${size}" height="${size}" style="transform: rotate(-90deg)">
                <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="hsl(40 14% 93%)" stroke-width="6"></circle>
                <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--app-sage)" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="${dash} ${c}"
                  style="transition: stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)"></circle>
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="text-center">
                  <div class="font-display text-[28px] leading-none tabular-nums">
                    ${Math.round(pct)}<span class="text-base text-[color:var(--muted-foreground)]">%</span>
                  </div>
                  <div class="text-[10px] uppercase tracking-wider text-[color:var(--muted-foreground)] mt-1">of goal</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function goalRow(icon, title, caption, trailing) {
        return `
          <div class="flex items-center justify-between p-3 rounded-xl" style="background:hsl(40 16% 94% / .7)">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center" style="color:var(--app-sage)">
                <i data-lucide="${icon}" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="font-medium text-[14px]">${title}</div>
                <div class="text-xs text-[color:var(--muted-foreground)]">${caption}</div>
              </div>
            </div>
            ${trailing}
          </div>
        `;
      }

      function impactTile(value, label) {
        return `
          <div class="text-center p-3 bg-white rounded-xl border border-[color:var(--app-line)]">
            <div class="font-display text-xl tabular-nums">${value}</div>
            <div class="text-[11px] text-[color:var(--muted-foreground)] mt-1 leading-snug">${label}</div>
          </div>
        `;
      }

      function userRow(user) {
        const followed = state.following.includes(user.id);
        const btn = `<button class="follow-btn px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1 shrink-0
               ${followed ? "border border-[color:var(--app-line)] text-[color:var(--muted-foreground)] bg-white" : "text-white"}"
               ${followed ? "" : `style="background:var(--app-ink)"`}
               data-user="${user.id}">
              <i data-lucide="${followed ? "user-check" : "user-plus"}" class="w-3.5 h-3.5"></i>
              ${followed ? "Following" : "Follow"}
            </button>`;
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-3.5">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                ${avatarHtml(user, 44)}
                <div class="min-w-0 text-left">
                  <h3 class="font-semibold text-[14px] truncate">${user.displayName}</h3>
                  <p class="text-xs text-[color:var(--muted-foreground)] truncate">@${user.username}</p>
                  ${user.bio ? `<p class="text-[11.5px] text-[color:var(--muted-foreground)] mt-0.5 truncate">${user.bio}</p>` : ""}
                </div>
              </div>
              ${btn}
            </div>
          </div>
        `;
      }

      function followingList() {
        const list = state.following.map((id) => Object.values(USERS).find((u) => u.id === id)).filter(Boolean);
        if (!list.length) return `<div class="text-center py-8 text-sm text-[color:var(--muted-foreground)]">You're not following anyone yet.</div>`;
        return list.map(userRow).join("");
      }

      function suggestionList() {
        const me = state.currentUserId;
        const suggestions = Object.values(USERS).filter((u) => u.id !== me && !state.following.includes(u.id)).slice(0, 3);
        if (!suggestions.length) return `<div class="text-center py-8 text-sm text-[color:var(--muted-foreground)]">You've found everyone for now.</div>`;
        return suggestions.map(userRow).join("");
      }

      function tripsHeader(trips) {
        const totalCarbon = trips.reduce((s, t) => s + calcCarbonSaved(t.mode, t.km), 0);
        return `
          <header class="text-white px-5 pt-7 pb-6 rounded-b-[28px] shadow-ink ring-hairline" style="background:var(--app-ink)">
            <div class="flex items-center gap-3 mb-5">
              <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center" data-go="home">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
              </button>
              <div class="text-left">
                <p class="text-[10px] uppercase tracking-[0.18em] text-white/60">Journal</p>
                <h1 class="text-[20px] font-semibold leading-tight">Trips</h1>
              </div>
            </div>
            <div class="rounded-2xl bg-white/10 p-4 grid grid-cols-3 gap-3">
              <div class="text-center">
                <div class="font-display text-[22px] leading-none tabular-nums">${trips.length}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/65 mt-1.5">Logged</div>
              </div>
              <div class="text-center">
                <div class="font-display text-[22px] leading-none tabular-nums">${state.bookings.length}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/65 mt-1.5">Booked</div>
              </div>
              <div class="text-center">
                <div class="font-display text-[22px] leading-none tabular-nums">${totalCarbon.toFixed(1)}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/65 mt-1.5">kg saved</div>
              </div>
            </div>
          </header>
        `;
      }

      function labelForDate(dateKey) {
        const d = new Date(dateKey);
        const days = Math.floor((Date.now() - d.getTime()) / 86400000);
        if (days === 0) return "Today";
        if (days === 1) return "Yesterday";
        if (days < 7) return `${days} days ago`;
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      /* ---------- 6. Renderer + events ---------- */

      function render() {
        const r = renderers[state.screen];
        if (!r) return;
        screens.innerHTML = r();
        if (window.lucide) lucide.createIcons();

        const navMap = { home: "home", discover: "discover", trips: "trips", profile: "profile", book: "book", log: null, rewards: null, share: null };
        document.querySelectorAll(".nav-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.go === navMap[state.screen]);
        });
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function go(name) {
        if (state.screen === name) return;
        state.screen = name;
        saveState();
        render();
      }

      /* — Click delegation — */
      document.body.addEventListener("click", (e) => {
        const navTarget = e.target.closest("[data-go]");
        if (navTarget) { go(navTarget.dataset.go); return; }

        const likeBtn = e.target.closest(".like-btn");
        if (likeBtn) {
          const id = +likeBtn.dataset.post;
          const p = state.posts.find((x) => x.id === id);
          if (p) {
            p.liked = !p.liked;
            p.likeCount += p.liked ? 1 : -1;
            saveState(); render();
          }
          return;
        }

        const followBtn = e.target.closest(".follow-btn");
        if (followBtn) {
          const id = +followBtn.dataset.user;
          const idx = state.following.indexOf(id);
          if (idx === -1) {
            state.following.push(id);
            const u = Object.values(USERS).find((x) => x.id === id);
            toast(`Following ${u.displayName}`);
          } else state.following.splice(idx, 1);
          saveState(); render();
          return;
        }

        const modeBtn = e.target.closest(".mode-btn");
        if (modeBtn) { window._logForm.mode = modeBtn.dataset.mode; render(); return; }

        const popular = e.target.closest(".popular-route");
        if (popular) {
          window._bookForm = {
            fromId: popular.dataset.from,
            toId: popular.dataset.to,
            when: window._bookForm?.when || "",
          };
          render();
          return;
        }

        const bookOpt = e.target.closest(".book-option");
        if (bookOpt) {
          bookTrip(bookOpt.dataset.mode);
          return;
        }

        const cancelBooking = e.target.closest(".cancel-booking");
        if (cancelBooking) {
          const id = +cancelBooking.dataset.booking;
          const idx = state.bookings.findIndex((b) => b.id === id);
          if (idx > -1) {
            const b = state.bookings[idx];
            state.bookings.splice(idx, 1);
            state.points = Math.max(0, state.points - b.points);
            toast(`Booking cancelled (−${formatPoints(b.points)} pts)`);
            saveState(); render();
          }
          return;
        }

        // Discover tab filter
        const discoverTab = e.target.closest(".discover-tab");
        if (discoverTab) {
          state.discoverFilter = discoverTab.dataset.discover;
          saveState(); render();
          return;
        }

        // Rewards category filter
        const rewardFilter = e.target.closest(".reward-filter");
        if (rewardFilter) {
          state.rewardFilter = rewardFilter.dataset.filter;
          saveState(); render();
          return;
        }

        // Redeem a reward
        const redeemBtn = e.target.closest(".redeem-btn");
        if (redeemBtn && !redeemBtn.disabled) {
          const r = rewardById(redeemBtn.dataset.reward);
          if (!r) return;
          if (state.points < r.cost) { toast("Not enough EcoPoints"); return; }
          if (!r.repeatable && state.redemptions.some((x) => x.rewardId === r.id)) {
            toast("Already claimed"); return;
          }
          if (!confirm(`Redeem "${r.name}" for ${formatPoints(r.cost)} EcoPoints?`)) return;
          state.points -= r.cost;
          state.redemptions.push({ id: Date.now(), rewardId: r.id, cost: r.cost, when: new Date().toISOString() });
          toast(`Redeemed "${r.name}"`);
          saveState(); render();
          return;
        }

        // Share Trip → post composer submit
        if (e.target.closest("[data-share-post]")) {
          const f = window._shareForm || {};
          if (!f.body?.trim()) { toast("Add a few words about your trip"); return; }
          const trip = f.tripId ? state.trips.find((t) => t.id === f.tripId) : null;
          const co2Per = trip ? (TRANSPORT_MODES[trip.mode]?.carbonPerKm ?? 0) : 0;
          const score = trip ? Math.round(100 - (co2Per / 0.155) * 55) : null;
          const newPost = {
            id: Date.now(),
            userId: state.currentUserId,
            body: f.body.trim(),
            tripId: trip?.id || null,
            ecoScore: score,
            likeCount: 0,
            liked: false,
            when: new Date().toISOString(),
            photo: false,
          };
          state.posts.unshift(newPost);
          window._shareForm = null;
          saveState();
          toast("Posted to your feed");
          go("discover");
          return;
        }
      });

      /* — Form changes — */
      document.body.addEventListener("input", (e) => {
        const id = e.target.id;
        if (id === "from") window._logForm.from = e.target.value;
        if (id === "to")   window._logForm.to   = e.target.value;
        if (id === "km") {
          window._logForm.km = e.target.value;
          rerenderPreservingFocus();
        }
        if (id === "book-from" || id === "book-to") {
          const c = cityByLabel(e.target.value);
          const key = id === "book-from" ? "fromId" : "toId";
          if (c) {
            window._bookForm[key] = c.id;
            rerenderPreservingFocus();
          } else {
            // user is mid-typing; clear if previously had a city
            if (window._bookForm[key]) {
              window._bookForm[key] = "";
              rerenderPreservingFocus();
            }
          }
        }
        if (id === "book-when") window._bookForm.when = e.target.value;
        if (id === "search-input") doSearch(e.target.value);
        if (id === "share-body" && window._shareForm) window._shareForm.body = e.target.value;
      });

      function rerenderPreservingFocus() {
        const focusId = document.activeElement?.id;
        const caret = document.activeElement?.selectionStart;
        const scroll = window.scrollY;
        render();
        window.scrollTo(0, scroll);
        const again = focusId && document.getElementById(focusId);
        if (again) {
          again.focus();
          if (caret != null) try { again.setSelectionRange(caret, caret); } catch (e) {}
        }
      }

      /* — Log-trip submit — */
      document.body.addEventListener("submit", (e) => {
        if (e.target.id !== "log-form") return;
        e.preventDefault();
        const f = window._logForm;
        const km = parseFloat(f.km);
        if (!f.from.trim() || !f.to.trim() || !(km > 0)) {
          toast("Fill in From, To, and Distance");
          return;
        }
        const newTrip = {
          id: Date.now(), mode: f.mode,
          from: f.from.trim(), to: f.to.trim(), km,
          date: new Date().toISOString(),
        };
        state.trips.unshift(newTrip);
        const saved = calcCarbonSaved(newTrip.mode, newTrip.km);
        saveState();
        window._logForm = { mode: "cycling", from: "", to: "", km: "" };
        toast(`Trip logged — ${saved.toFixed(1)} kg CO₂ avoided`);
        go("home");
      });

      /* — Book trip — */
      function bookTrip(modeKey) {
        const f = window._bookForm;
        const from = cityById(f.fromId);
        const to   = cityById(f.toId);
        if (!from || !to) { toast("Pick a From and a To from the list"); return; }
        if (from.id === to.id) { toast("Pick two different cities"); return; }

        const opt = optionsForRoute(from, to).find((o) => o.key === modeKey);
        if (!opt) { toast("That option isn't available for this route"); return; }

        const booking = {
          id: Date.now(),
          mode: opt.key,
          service: opt.service || null,
          from: from.name,
          to: to.name,
          km: opt.km,
          points: opt.points,
          co2: opt.co2,
          durationH: opt.durationH || estimateDuration(opt.key, opt.km),
          when: f.when ? new Date(f.when).toISOString() : daysFromNow(7),
          status: "booked",
        };
        state.bookings.unshift(booking);
        state.points += opt.points;
        saveState();
        window._bookForm = { fromId: "", toId: "", when: "" };

        const via = opt.service ? ` via ${opt.service}` : "";
        toast(`Booked ${from.name} → ${to.name}${via} · +${formatPoints(opt.points)} pts`);
        go("home");
      }

      /* — Search — */
      function doSearch(q) {
        const sec = $("#search-results-section");
        const sug = $("#suggestions-section");
        const out = $("#search-results");
        if (!sec || !sug || !out) return;
        const term = q.trim().toLowerCase();
        if (term.length < 2) { sec.style.display = "none"; sug.style.display = "block"; return; }
        sec.style.display = "block";
        sug.style.display = "none";
        const matches = Object.values(USERS).filter((u) =>
          u.id !== state.currentUserId &&
          (u.displayName.toLowerCase().includes(term) || u.username.toLowerCase().includes(term))
        );
        out.innerHTML = matches.length
          ? matches.map(userRow).join("")
          : `<div class="text-center py-8 text-sm text-[color:var(--muted-foreground)]">No matches.</div>`;
        if (window.lucide) lucide.createIcons();
      }

      /* — Reset — */
      window.resetData = function () {
        if (confirm("Clear all trips, bookings and points?")) {
          localStorage.removeItem(STORAGE_KEY);
          location.reload();
        }
      };

      /* ---------- 7. Boot ---------- */
      render();
    </script>
  </body>
</html>
