<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>WanderWell — travel that gives back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: hsl(40, 15%, 98%);
        --foreground: hsl(220, 18%, 12%);
        --muted-foreground: hsl(220, 9%, 46%);
        --card: hsl(0, 0%, 100%);
        --border: hsl(220, 14%, 92%);
        --secondary: hsl(40, 16%, 94%);
        --app-ink: hsl(220, 20%, 10%);
        --app-ink-soft: hsl(220, 16%, 22%);
        --app-sage: hsl(150, 30%, 26%);
        --app-sage-soft: hsl(150, 24%, 92%);
        --app-gold: hsl(38, 75%, 50%);
        --app-gold-soft: hsl(40, 80%, 94%);
        --app-line: hsl(220, 14%, 91%);
        --shell-max: 460px;
      }
      html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        letter-spacing: -0.005em;
        background:
          radial-gradient(900px 500px at 50% -200px, hsl(150 24% 94%) 0%, transparent 60%),
          var(--background);
        color: var(--foreground);
        margin: 0;
        min-height: 100vh;
        padding-bottom: 96px;
      }
      .font-display {
        font-family: "Fraunces", "Inter", serif;
        font-feature-settings: "lnum", "tnum";
        letter-spacing: -0.02em;
      }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      .shadow-elev-1 {
        box-shadow: 0 1px 0 hsl(220 14% 92% / .6), 0 1px 2px hsl(220 20% 10% / .04), 0 4px 12px hsl(220 20% 10% / .04);
      }
      .shadow-ink {
        box-shadow: 0 8px 24px hsl(220 24% 8% / .18), 0 2px 6px hsl(220 24% 8% / .12);
      }
      .ring-hairline { box-shadow: inset 0 0 0 1px hsl(0 0% 100% / .08); }
      .lucide { stroke-width: 1.75; }

      .app-shell { max-width: var(--shell-max); margin: 0 auto; position: relative; min-height: 100vh; }
      .screen { min-height: 100vh; }
      .screen.hidden { display: none; }

      .nav-bottom {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: var(--shell-max);
        background: hsl(0 0% 100% / .9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--app-line);
        padding: 8px 8px max(14px, env(safe-area-inset-bottom)); z-index: 50;
      }
      .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 8px; color: hsl(220 9% 60%); transition: color .15s; background: transparent; border: none; cursor: pointer; }
      .nav-btn.active { color: var(--app-ink); }
      .nav-pill {
        display: flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 9999px;
        background: transparent; transition: background .2s;
      }
      .nav-btn.active .nav-pill { background: var(--app-sage-soft); }
      .nav-btn span:last-child { font-size: 10.5px; margin-top: 2px; font-weight: 500; }
      .nav-btn.active span:last-child { font-weight: 600; }

      /* Raised center "+" button in the bottom nav */
      .nav-center { padding: 0 8px; }
      .nav-center .center-plus {
        width: 52px; height: 52px;
        border-radius: 9999px;
        background: var(--app-sage);
        color: white;
        display: flex; align-items: center; justify-content: center;
        transform: translateY(-14px);
        box-shadow:
          0 8px 18px hsl(150 30% 26% / .35),
          0 2px 4px hsl(150 30% 26% / .25),
          0 0 0 4px var(--background);
        transition: transform .15s, background .15s;
      }
      .nav-center:hover .center-plus { transform: translateY(-16px); background: hsl(150 32% 22%); }
      .nav-center:active .center-plus { transform: translateY(-12px); }
      .nav-center .label-plus { font-size: 10.5px; margin-top: -8px; font-weight: 500; color: hsl(220 9% 60%); }

      .avatar {
        position: relative; overflow: hidden; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        color: white; font-weight: 600; user-select: none; border-radius: 9999px;
      }
      .avatar .initials { position: relative; z-index: 0; line-height: 1; }
      .avatar img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; background: transparent; }

      .input {
        width: 100%; height: 48px; padding: 0 16px;
        border-radius: 16px;
        background: hsl(40 16% 94% / .7);
        border: 1px solid transparent;
        font-size: 14px; color: var(--foreground); font-family: inherit;
        transition: border-color .15s, background .15s;
        box-sizing: border-box; min-width: 0;
      }
      .input:focus { outline: none; border-color: var(--app-sage); background: white; }
      .input::placeholder { color: hsl(220 9% 55%); }
      /* Native date inputs have an intrinsic min-width and overflow narrow screens — normalise */
      .input[type="date"] {
        -webkit-appearance: none; appearance: none;
        max-width: 100%; min-width: 0;
        display: block;
      }
      .input[type="date"] { text-align: left; }
      .input[type="date"]::-webkit-date-and-time-value { text-align: left; }

      .toast {
        position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
        bottom: 110px; z-index: 70;
        background: var(--app-ink); color: white;
        padding: 12px 18px; border-radius: 9999px;
        font-size: 13px; font-weight: 500;
        box-shadow: 0 10px 25px hsl(220 24% 8% / .25);
        opacity: 0; pointer-events: none;
        transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);
        max-width: 90%;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .fab {
        position: fixed; right: max(16px, calc(50vw - var(--shell-max)/2 + 16px));
        bottom: 96px; z-index: 40;
        width: 56px; height: 56px;
        border-radius: 9999px;
        background: var(--app-ink); color: white;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px hsl(220 24% 8% / .25), 0 2px 6px hsl(220 24% 8% / .15);
        border: none; cursor: pointer; transition: transform .15s;
      }
      .fab:hover { transform: scale(1.05); }
      .fab:active { transform: scale(0.95); }

      .option-card { transition: transform .15s, box-shadow .15s, border-color .15s; cursor: pointer; }
      .option-card:hover { transform: translateY(-1px); border-color: var(--app-sage); }
      .option-card:active { transform: translateY(0); }

      /* Carbon progress bar (from ecotravel idea) */
      .carbon-progress {
        height: 8px; background: hsl(40 16% 92%); border-radius: 9999px; overflow: hidden;
      }
      .carbon-progress > div {
        height: 100%; background: linear-gradient(90deg, var(--app-sage), hsl(150 30% 36%));
        transition: width .8s cubic-bezier(.2,.8,.2,1);
      }

      /* — Hi-fi page hero used on all non-home screens.
           Layered radial gradients give depth without external imagery; a thin
           inset hairline catches the light at the top edge for a premium feel. */
      .page-hero {
        position: relative;
        color: white;
        padding: 32px 20px 28px;
        border-radius: 0 0 32px 32px;
        overflow: hidden;
        background:
          radial-gradient(120% 80% at 100% 0%, hsl(150 32% 22%) 0%, transparent 55%),
          radial-gradient(120% 100% at 0% 100%, hsl(220 24% 14%) 0%, transparent 60%),
          var(--app-ink);
        box-shadow:
          0 12px 28px hsl(220 24% 8% / .22),
          inset 0 1px 0 hsl(0 0% 100% / .07);
      }
      .page-hero::after {
        /* Subtle vignette dot pattern */
        content: "";
        position: absolute; inset: 0;
        background-image: radial-gradient(hsl(0 0% 100% / .04) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
        mix-blend-mode: overlay;
      }
      .page-hero > * { position: relative; z-index: 1; }
      .hero-eyebrow {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: hsl(150 40% 78%);
        font-weight: 600;
      }
      .hero-title {
        font-family: "Fraunces", "Inter", serif;
        font-feature-settings: "lnum", "tnum";
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.08;
        margin-top: 4px;
      }
      .hero-subtitle { font-size: 13px; color: hsl(0 0% 100% / .65); margin-top: 6px; max-width: 280px; line-height: 1.5; }

      /* Section subtitle eyebrow used inside body content */
      .eyebrow {
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--muted-foreground); font-weight: 600;
      }

      /* Sophisticated section divider with a centered leaf accent */
      .section-divider {
        display: flex; align-items: center; gap: 12px;
        color: var(--muted-foreground);
      }
      .section-divider::before, .section-divider::after {
        content: ""; flex: 1; height: 1px; background: var(--app-line);
      }

      /* Soft card lift on hover for clickable cards */
      .lift { transition: transform .15s ease, box-shadow .15s ease; }
      .lift:hover { transform: translateY(-1px); box-shadow: 0 4px 16px hsl(220 24% 8% / .08), 0 1px 2px hsl(220 24% 8% / .04); }

      /* Strava-style toggle switch */
      .toggle-switch {
        display: inline-block; position: relative;
        width: 36px; height: 22px; border-radius: 9999px;
        background: hsl(220 14% 86%);
        transition: background .2s ease;
        flex-shrink: 0;
      }
      .toggle-switch .dot {
        position: absolute; top: 2px; left: 2px;
        width: 18px; height: 18px; border-radius: 9999px;
        background: white;
        box-shadow: 0 1px 3px hsl(220 24% 8% / .25);
        transition: transform .2s ease;
      }
      .toggle-switch.on { background: var(--app-sage); }
      .toggle-switch.on .dot { transform: translateX(14px); }

      /* Strava-style photo slot */
      .photo-slot {
        position: relative; aspect-ratio: 1;
        border-radius: 12px; overflow: hidden;
        background: var(--secondary);
        border: 1px dashed var(--app-line);
        display: flex; align-items: center; justify-content: center;
        color: var(--muted-foreground);
        cursor: pointer;
        transition: border-color .15s, background .15s;
      }
      .photo-slot:hover { border-color: var(--app-sage); background: var(--app-sage-soft); color: var(--app-sage); }
      .photo-slot.filled { border-style: solid; }
      .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
      .photo-slot .rm {
        position: absolute; top: 4px; right: 4px;
        width: 22px; height: 22px; border-radius: 9999px;
        background: hsl(220 24% 8% / .6); color: white;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 12px; line-height: 0;
      }
    </style>
  <style id="embed-no-scrollbar">html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}</style></head>
  <body>
    <div class="app-shell">
      <main id="screens"></main>
    </div>

    <nav class="nav-bottom">
      <div class="flex items-stretch">
        <button class="nav-btn" data-go="home">
          <span class="nav-pill"><i data-lucide="home" class="w-[18px] h-[18px]"></i></span>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-go="book">
          <span class="nav-pill"><i data-lucide="ticket" class="w-[18px] h-[18px]"></i></span>
          <span>Book</span>
        </button>
        <button class="nav-btn nav-center" data-go="share" aria-label="Add new post">
          <span class="center-plus"><i data-lucide="plus" class="w-6 h-6"></i></span>
          <span class="label-plus">Post</span>
        </button>
        <button class="nav-btn" data-go="trips">
          <span class="nav-pill"><i data-lucide="route" class="w-[18px] h-[18px]"></i></span>
          <span>Trips</span>
        </button>
        <button class="nav-btn" data-go="profile">
          <span class="nav-pill"><i data-lucide="user" class="w-[18px] h-[18px]"></i></span>
          <span>Profile</span>
        </button>
      </div>
    </nav>

    <div id="toast" class="toast"></div>

    <script>
      /* =================== DATA =================== */

      const TRANSPORT_MODES = {
        walking:         { name: "Walking",          icon: "🚶", carbonPerKm: 0    },
        cycling:         { name: "Cycling",          icon: "🚴", carbonPerKm: 0    },
        publicTransport: { name: "Public Transport", icon: "🚌", carbonPerKm: 0.05 },
        electricVehicle: { name: "Electric Vehicle", icon: "🔋", carbonPerKm: 0.02 },
        carpool:         { name: "Carpool",          icon: "🚗", carbonPerKm: 0.10 },
        airplane:        { name: "Airplane",         icon: "✈️", carbonPerKm: 0.25 },
      };
      const CAR_BASELINE = 0.21;
      const calcCarbonSaved = (mode, km) => {
        const m = TRANSPORT_MODES[mode] || BOOKING_MODES.find((x) => x.key === mode);
        const per = m ? (m.carbonPerKm ?? m.co2Per ?? 0) : 0;
        return Math.max(0, km * CAR_BASELINE - km * per);
      };
      const carbonMessage = (kg) => {
        if (kg >= 5)   return "Amazing — that's a real dent in your footprint.";
        if (kg >= 2)   return "Great work. Small choices, real difference.";
        if (kg >= 0.5) return "Nice — every km adds up.";
        return "Every sustainable choice matters.";
      };

      const BOOKING_MODES = [
        { key: "walk",      name: "Walk",              icon: "🚶", co2Per: 0,     pointsPerKm: 60, ecoScore: 100, pricePerKm: 0,
          features: ["Zero emissions", "No ticket needed", "Get a little extra movement"] },
        { key: "bike",      name: "Bicycle",           icon: "🚴", co2Per: 0,     pointsPerKm: 55, ecoScore: 99, pricePerKm: 0,
          features: ["Zero emissions", "Free if you own a bike", "Often faster than a car in cities"] },
        { key: "ebike",     name: "E-Bike",            icon: "🚲", co2Per: 0.014, pointsPerKm: 45, ecoScore: 95, pricePerKm: 0.20,
          features: ["Battery powered, minimal CO₂", "Skip traffic and parking", "Available via Lime, Voi, Lyft and more"] },
        { key: "metro",     name: "Metro / Subway",    icon: "🚇", co2Per: 0.028, pointsPerKm: 35, ecoScore: 92, pricePerKm: 0.30,
          features: ["Electric, grid-powered", "Frequent service in city centres", "Often cheaper than driving"] },
        { key: "tram",      name: "Tram / Light Rail", icon: "🚊", co2Per: 0.029, pointsPerKm: 35, ecoScore: 92, pricePerKm: 0.25,
          features: ["Electric, grid-powered", "Step-free access at most stops", "Reduced carbon footprint compared to cars"] },
        { key: "bus",       name: "Bus / Coach",       icon: "🚌", co2Per: 0.027, pointsPerKm: 38, ecoScore: 88, pricePerKm: 0.12,
          features: ["Multiple departure times daily", "Comfortable seating with extra legroom", "Reduced carbon footprint compared to cars"] },
        { key: "hsRail",    name: "High-Speed Rail",   icon: "🚄", co2Per: 0.006, pointsPerKm: 55, ecoScore: 97, pricePerKm: 0.25,
          features: ["Direct connection available", "Wi-Fi and power outlets on board", "Carbon offset included with eco ticket"] },
        { key: "train",     name: "Regional Train",    icon: "🚆", co2Per: 0.035, pointsPerKm: 40, ecoScore: 88, pricePerKm: 0.18,
          features: ["Up to 90% less CO₂ than flying", "City-centre to city-centre, no transfers", "Easy walk-on with luggage"] },
        { key: "ferry",     name: "Ferry",             icon: "⛴️",  co2Per: 0.019, pointsPerKm: 30, ecoScore: 86, pricePerKm: 0.30,
          features: ["Foot-passenger fares", "Sea views, cabin space", "Scenic, sociable journey"] },
        { key: "ev",        name: "Electric Car",      icon: "🔋", co2Per: 0.047, pointsPerKm: 22, ecoScore: 80, pricePerKm: 0.15,
          features: ["Zero tailpipe emissions", "Fast-charge network expanding", "Quiet, smooth ride"] },
        { key: "carpool",   name: "Rideshare / Carpool", icon: "🚗", co2Per: 0.043, pointsPerKm: 18, ecoScore: 78, pricePerKm: 0.10,
          features: ["Connect with other travelers", "Split the cost of fuel", "Lower emissions than driving alone"] },
        { key: "flightSaf", name: "Flight — SAF",      icon: "✈️", co2Per: 0.075, pointsPerKm: 8,  ecoScore: 65, pricePerKm: 0.28,
          features: ["Sustainable Aviation Fuel — up to 70% less CO₂", "Same schedule as a regular flight", "Some airlines opt in at booking"] },
        { key: "flight",    name: "Flight",            icon: "✈️", co2Per: 0.155, pointsPerKm: 0,  ecoScore: 45, pricePerKm: 0.18,
          features: ["Fastest option for long-haul", "Widest schedule", "Highest carbon footprint of the options"] },
      ];

      function ecoBadge(score) {
        if (score >= 90) return { label: "Excellent", color: "var(--app-sage)",  bg: "var(--app-sage-soft)" };
        if (score >= 80) return { label: "Great",     color: "hsl(82 50% 32%)",  bg: "hsl(82 50% 95%)" };
        if (score >= 65) return { label: "Good",      color: "hsl(40 70% 32%)",  bg: "hsl(40 80% 94%)" };
        return            { label: "Carbon-heavy",   color: "hsl(15 65% 38%)",  bg: "hsl(15 70% 95%)" };
      }
      function lessThanFlying(co2Per) { return Math.max(0, Math.round((1 - co2Per / 0.155) * 100)); }
      function formatPrice(eur) {
        if (eur === 0) return "Free";
        if (eur < 10) return `€${eur.toFixed(2)}`;
        return `€${Math.round(eur)}`;
      }
      const byKey = (k) => BOOKING_MODES.find((m) => m.key === k);

      const avatarUrl = (id) => `https://i.pravatar.cc/200?img=${id}`;
      const USERS = {
        sarah: { id: 1, username: "sarah_eco",      displayName: "Sarah Green",    bio: "Cycling enthusiast and climate advocate.",                              photo: avatarUrl(47), followers: 128, following: 96 },
        alex:  { id: 2, username: "alex_rider",     displayName: "Alex Rivera",    bio: "Public transport champion, saving the planet one ride at a time.",       photo: avatarUrl(11) },
        jamie: { id: 3, username: "jamie_walker",   displayName: "Jamie Walker",   bio: "Walking everywhere, one step at a time.",                                photo: avatarUrl(32) },
        green: { id: 4, username: "green_commuter", displayName: "Green Commuter", bio: "EV owner transitioning to sustainable transport.",                       photo: avatarUrl(23) },
        maya:  { id: 5, username: "maya_pedals",    displayName: "Maya Chen",      bio: "200 km cycled this month.",                                              photo: avatarUrl(44) },
        liam:  { id: 6, username: "liam_transit",   displayName: "Liam O'Connor",  bio: "Train commuter and weekend hiker.",                                      photo: avatarUrl(13) },
      };

      /* Achievements now carry progress + target (ecotravel-inspired) */
      const ACHIEVEMENTS = [
        { id: 1, icon: "🚴", title: "Cycle Champion", description: "Take 50 bike trips",         target: 50,  progressFn: (s) => s.trips.filter(t => t.mode === "cycling").length,
          gradient: "linear-gradient(135deg, #3b4a3f, #1f2a23)" },
        { id: 2, icon: "🌟", title: "Eco Warrior",    description: "Save 100 kg CO₂",            target: 100, progressFn: (s) => Math.round(totalCarbonSaved()),
          gradient: "linear-gradient(135deg, #2f3a3a, #1a2424)" },
        { id: 3, icon: "🍃", title: "Green Commuter", description: "Build a 7-day eco streak",   target: 7,   progressFn: (s) => currentStreak(),
          gradient: "linear-gradient(135deg, #4a4337, #2a241c)" },
        { id: 4, icon: "💚", title: "Carbon Crusher", description: "Save 50 kg CO₂",             target: 50,  progressFn: (s) => Math.round(totalCarbonSaved()),
          gradient: "linear-gradient(135deg, #3a3f4a, #1f242e)" },
        { id: 5, icon: "🚆", title: "Rail Romantic",  description: "Book 3 trips by train",      target: 3,   progressFn: (s) => s.bookings.filter(b => b.mode === "hsRail" || b.mode === "train").length,
          gradient: "linear-gradient(135deg, #2a3d4a, #11202e)" },
        { id: 6, icon: "🌍", title: "World Explorer", description: "Log 20 sustainable trips",   target: 20,  progressFn: (s) => s.trips.length,
          gradient: "linear-gradient(135deg, #4a3a40, #2a1f23)" },
      ];

      /* Long-term challenges (ecotravel-inspired) — opt-in goals */
      const CHALLENGES = [
        { id: "neutral",  icon: "globe",        title: "Carbon-Neutral Traveler",  desc: "Offset 500 kg of CO₂ through sustainable choices.", target: 500, points: 15000 },
        { id: "explorer", icon: "map",          title: "Eco-Explorer",             desc: "Book 5 trips by HSR or train this year.",            target: 5,   points: 8000 },
        { id: "influencer", icon: "megaphone",  title: "Sustainability Influencer", desc: "Inspire 10 friends to follow you.",                  target: 10,  points: 6000 },
      ];

      /* Trending sustainable destinations — Queenstown and Freiburg replaced
         with cities that have more reliable Unsplash imagery. Each card has a
         gradient fallback if the image fails to load. */
      const DESTINATIONS = [
        { id: "kyoto",     name: "Kyoto",        country: "Japan",       tagline: "Bamboo forests & temple trails",
          image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&q=80&auto=format&fit=crop",
          gradient: "linear-gradient(135deg,#3b4a3f,#1f2a23)", score: 94 },
        { id: "cinque",    name: "Cinque Terre", country: "Italy",       tagline: "Carless coastal villages",
          image: "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=600&q=80&auto=format&fit=crop",
          gradient: "linear-gradient(135deg,#4a3a40,#2a1f23)", score: 92 },
        { id: "copenhagen",name: "Copenhagen",   country: "Denmark",     tagline: "World's most cycle-friendly city",
          image: "https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?w=600&q=80&auto=format&fit=crop",
          gradient: "linear-gradient(135deg,#2f3a3a,#1a2424)", score: 95 },
        { id: "stockholm", name: "Stockholm",    country: "Sweden",      tagline: "Nordic city built across islands",

      function haversineKm(a, b) {
        const R = 6371;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }
      const SAME_REGION = {
        Europe: ["United Kingdom","Ireland","France","Belgium","Netherlands","Germany","Switzerland","Austria","Spain","Portugal","Italy","Denmark","Sweden","Norway"],
        NorthAmerica: ["USA","Canada"],
        EastAsia: ["Japan","South Korea","China","Hong Kong"],
        SEAsia: ["Singapore","Thailand"],
        Oceania: ["Australia","New Zealand"],
      };
      function regionOf(country) { for (const r of Object.keys(SAME_REGION)) if (SAME_REGION[r].includes(country)) return r; return "Other"; }
      const sameRegion = (a, b) => regionOf(a.country) === regionOf(b.country);

      function optionsForRoute(from, to) {
        if (!from || !to || from.id === to.id) return null;
        const greatCircle = haversineKm(from, to);
        const corridor = corridorFor(from.id, to.id);
        const sc = sameRegion(from, to);
        const include = [];
        const push = (key, overrides = {}) => include.push({ key, ...overrides });

        if (greatCircle <= 5)  push("walk");
        if (greatCircle <= 25) push("bike");
        if (greatCircle <= 40) push("ebike");
        if (greatCircle <= 35) push("metro");
        if (greatCircle <= 35) push("tram");
        if (sc && greatCircle >= 10 && greatCircle <= 1500) push("bus");
        if (sc) {
          if (corridor) push(corridor.kind, { service: corridor.service, durationH: corridor.durationH, railFactor: corridor.railFactor });
          else {
            if (greatCircle >= 30 && greatCircle <= 1500) push("train");
            if (greatCircle >= 200 && greatCircle <= 1500) push("hsRail");
          }
        }
        if (sc && greatCircle >= 5 && greatCircle <= 1200) push("ev");
        if (sc && greatCircle >= 5 && greatCircle <= 1200) push("carpool");
        const ferryKeys = ["dublin|london","dublin|manchester","dublin|edinburgh"];
        const pairA = `${from.id}|${to.id}`, pairB = `${to.id}|${from.id}`;
        if (ferryKeys.includes(pairA) || ferryKeys.includes(pairB)) push("ferry");
        if (greatCircle >= 300) push("flightSaf");
        if (greatCircle >= 250) push("flight");

        const seen = new Set();
        const dedup = include.filter((c) => seen.has(c.key) ? false : seen.add(c.key));

        const computed = dedup.filter((c) => byKey(c.key)).map((c) => {
          const base = byKey(c.key);
          const groundFactor = c.railFactor || ({ hsRail: 1.08, train: 1.15, bus: 1.18, ev: 1.25, carpool: 1.25, ferry: 1.10 }[c.key] || 1);
          const isGround = ["bus","train","hsRail","ev","carpool","ferry"].includes(c.key);
          const km = isGround ? greatCircle * groundFactor : greatCircle;
          const co2 = +(km * base.co2Per).toFixed(2);
          const points = Math.round(km * base.pointsPerKm);
          const price = base.pricePerKm === 0 ? 0 : km * base.pricePerKm;
          return {
            ...base, key: c.key, service: c.service || null, durationH: c.durationH || null,
            km: +km.toFixed(1), co2, points,
            price: +price.toFixed(2),
            lessFlying: lessThanFlying(base.co2Per),
          };
        });
        // savedVs = compare to the WORST option in this route's own list
        const worst = computed.reduce((w, o) => (o.co2 > w.co2 ? o : w), computed[0] || { co2: 0 });
        computed.forEach((o) => {
          o.savedVs = +Math.max(0, worst.co2 - o.co2).toFixed(2);
          o.comparedTo = worst.service ? `${worst.name} (${worst.service})` : worst.name;
        });
        return computed.sort((a, b) => a.co2 - b.co2 || b.points - a.points);
      }

      function formatTimeAgo(iso) {
        const diffH = Math.floor((Date.now() - new Date(iso).getTime()) / 36e5);
        if (diffH < 1) return "Just now";
        if (diffH === 1) return "1h ago";
        if (diffH < 24) return `${diffH}h ago`;
        if (diffH < 48) return "Yesterday";
        return `${Math.floor(diffH / 24)}d ago`;
      }
      function formatFutureDate(iso) {
        const d = new Date(iso);
        const diff = Math.round((d.getTime() - Date.now()) / 86400000);
        if (diff <= 0) return "Today";
        if (diff === 1) return "Tomorrow";
        if (diff < 7) return `In ${diff} days`;
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      function todayCarbon() {

      function weeklyStats() {
        const wAgo = Date.now() - 7 * 86400000;
        const w = state.trips.filter((t) => new Date(t.date).getTime() >= wAgo);
        const ecoTrips = w.filter((t) => t.mode !== "carpool" && t.mode !== "airplane").length;
        const carbon = w.reduce((s, t) => s + calcCarbonSaved(t.mode, t.km), 0);
        const counts = {};
        w.forEach((t) => (counts[t.mode] = (counts[t.mode] || 0) + 1));
        const fav = Object.entries(counts).sort((a,b) => b[1] - a[1])[0]?.[0] || "cycling";
        return { ecoTrips, carbon, favoriteMode: fav };

      function currentStreak() {
        const days = new Set(state.trips
          .filter((t) => t.mode !== "carpool" && t.mode !== "airplane")
          .map((t) => new Date(t.date).toDateString()));
        let streak = 0;
        for (let i = 0; i < 60; i++) {
          const d = new Date(); d.setDate(d.getDate() - i);
          if (days.has(d.toDateString())) streak++;
          else if (i > 0) break;
        }
        return streak;

      function carbonBySource() {
        const buckets = { active: 0, transit: 0, ev: 0 };
        for (const t of state.trips) {

          if (t.mode === "walking" || t.mode === "cycling") buckets.active += saved;
          else if (t.mode === "publicTransport") buckets.transit += saved;
          else if (t.mode === "electricVehicle") buckets.ev += saved;
        }
        return buckets;

      function makeShareForm(sourceType, sourceId) {
        const src = resolveShareSource({ sourceType, sourceId });
        return {
          sourceType,                            // "trip" or "booking"
          sourceId: sourceId || null,
          title: src ? defaultShareTitle(sourceType, src) : "",

      /* Normalise a logged trip or upcoming booking into a unified shape. */
      function resolveShareSource(f) {
        if (!f || !f.sourceId) return null;
        if (f.sourceType === "booking") {
          const b = state.bookings.find((x) => x.id === f.sourceId);
          if (!b) return null;
          const mode = byKey(b.mode) || { icon: "🎫", name: b.mode };
          const co2Per = mode.co2Per ?? 0;
          const km = b.km;
          const savedKg = Math.max(0, km * 0.155 - km * co2Per);     // vs standard flight where present, falls back to 0
          const typicalSavedPct = co2Per ? Math.round((1 - co2Per / 0.155) * 100) : 0;
          return {
            kind: "booking", id: b.id,
            icon: mode.icon, name: mode.name, service: b.service,
            from: b.from, to: b.to, km, savedKg,
            ecoScore: mode.ecoScore ?? Math.round(100 - (co2Per / 0.155) * 55),
            durStr: b.durationH ? formatHours(b.durationH) : (estimateDuration(b.mode, km) ? formatHours(estimateDuration(b.mode, km)) : "—"),
            typicalSavedPct,
          };
        }
        const t = state.trips.find((x) => x.id === f.sourceId);
        if (!t) return null;
        const tm = TRANSPORT_MODES[t.mode] || { icon: "🚗", name: t.mode };
        const co2Per = tm.carbonPerKm ?? 0;
        const km = t.km;
        const savedKg = calcCarbonSaved(t.mode, km);
        const typicalCo2 = km >= 250 ? km * 0.155 : km * 1.25 * 0.171;
        const tripCo2 = km * co2Per;
        const typicalSavedPct = typicalCo2 > 0 ? Math.round(((typicalCo2 - tripCo2) / typicalCo2) * 100) : 0;
        return {
          kind: "trip", id: t.id,
          icon: tm.icon, name: tm.name, service: null,
          from: t.from, to: t.to, km, savedKg,
          ecoScore: Math.round(100 - (co2Per / 0.155) * 55),
          durStr: estimateDuration(t.mode, km) ? formatHours(estimateDuration(t.mode, km)) : "—",

      /* =================== COMPONENTS =================== */
      function postCard(post) {
        const u = Object.values(USERS).find((x) => x.id === post.userId);
        // Resolve the source — a trip, a booking, or none
        const src = resolveShareSource({ sourceType: post.bookingId ? "booking" : "trip", sourceId: post.bookingId || post.tripId });
        const include = post.include || { ecoScore: true, co2: true, distance: true, comparison: true };

        // Carbon comparison numbers
        let typicalCo2 = 0, tripCo2 = 0, typicalLabel = "Typical trip";
        if (src) {
          const co2Per = src.kind === "trip"
            ? (TRANSPORT_MODES[state.trips.find(t => t.id === src.id)?.mode]?.carbonPerKm ?? 0)
            : (byKey(state.bookings.find(b => b.id === src.id)?.mode)?.co2Per ?? 0);
          tripCo2 = src.km * co2Per;
          typicalCo2 = src.km >= 250 ? src.km * 0.155 : src.km * 1.25 * 0.171;
          typicalLabel = src.km >= 250 ? "Standard flight" : "Petrol car";
        }

        const badge = score != null ? ecoBadge(score) : null;

              <span>🔋 Electric car</span>    <span class="text-right tabular-nums font-semibold">22 / km</span>
              <span>🚗 Carpool</span>         <span class="text-right tabular-nums font-semibold">18 / km</span>
              <span>✈️ SAF flight</span>      <span class="text-right tabular-nums font-semibold">8 / km</span>
              <span>✈️ Standard flight</span> <span class="text-right tabular-nums font-semibold">0 / km</span>
            </div>
            <p class="text-[12px] text-foreground/70 mt-3 leading-relaxed">
              Multiplier × route distance = points. A London → Paris booking on Eurostar (≈ 364 km) earns about <strong>20,000 pts</strong> — enough to plant 20 trees or unlock a Lime ride pack.
            </p>
          </div>`;
      }

      function rewardCard(r) {
        const claimed = state.redemptions.some((x) => x.rewardId === r.id);
        const cant = state.points < r.cost;
        const blocked = (claimed && !r.repeatable) || cant;
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 overflow-hidden">
            <div class="flex">
              <div class="w-20 flex items-center justify-center text-4xl shrink-0" style="background:${r.gradient}">${r.icon}</div>
              <div class="flex-1 p-4 min-w-0">
                <div class="flex items-start justify-between gap-2 mb-1">
                  <div class="min-w-0">
                    <p class="text-[10px] uppercase tracking-wider text-[color:var(--muted-foreground)]">${r.partner}</p>
                    <h3 class="font-semibold text-[14.5px] leading-tight truncate">${r.name}</h3>
                  </div>
                  <div class="flex items-center gap-1 px-2.5 py-1 rounded-full shrink-0" style="background:var(--app-gold-soft)">
                    <i data-lucide="award" class="w-3.5 h-3.5" style="color:var(--app-gold)"></i>
                    <span class="font-semibold tabular-nums text-[12px]" style="color:hsl(38 60% 25%)">${formatPoints(r.cost)}</span>
                  </div>
                </div>
                <p class="text-[12px] text-[color:var(--muted-foreground)] leading-snug mb-3">${r.description}</p>
                <button class="redeem-btn text-[12.5px] font-medium px-3.5 py-1.5 rounded-full
                              ${blocked ? "bg-[color:var(--secondary)] text-[color:var(--muted-foreground)] cursor-not-allowed" : "bg-[color:var(--app-ink)] text-white hover:bg-[color:var(--app-ink-soft)]"}"
                        data-reward="${r.id}" ${blocked ? "disabled" : ""}>
                  ${claimed && !r.repeatable ? "Claimed" : (cant ? `Need ${formatPoints(r.cost - state.points)} more` : "Redeem")}
                </button>
              </div>
            </div>
          </div>`;
      }

      function redemptionRow(red) {
        const r = rewardById(red.rewardId);
        if (!r) return "";
        return `
          <div class="flex items-center gap-3 p-3 rounded-xl bg-secondary/60">
            <div class="text-xl">${r.icon}</div>
            <div class="flex-1 min-w-0">
              <div class="text-[13px] font-medium truncate">${r.name}</div>
              <div class="text-[11px] text-[color:var(--muted-foreground)]">${r.partner} · ${formatTimeAgo(red.when)}</div>
            </div>
            <span class="text-[11px] text-[color:var(--muted-foreground)] tabular-nums">−${formatPoints(red.cost)}</span>
          </div>`;
      }

      function impactTile(value, label) {
        return `
          <div class="text-center p-3 bg-white rounded-xl border border-[color:var(--app-line)]">
            <div class="font-display text-xl tabular-nums">${value}</div>
            <div class="text-[11px] text-[color:var(--muted-foreground)] mt-1 leading-snug">${label}</div>
          </div>`;
      }

      function userRow(user) {
        const followed = state.following.includes(user.id);
        const btn = `<button class="follow-btn px-3 py-1.5 rounded-full text-[12px] font-medium flex items-center gap-1 shrink-0
               ${followed ? "border border-[color:var(--app-line)] text-[color:var(--muted-foreground)] bg-white" : "text-white"}"
               ${followed ? "" : `style="background:var(--app-ink)"`} data-user="${user.id}">
              <i data-lucide="${followed ? "user-check" : "user-plus"}" class="w-3.5 h-3.5"></i> ${followed ? "Following" : "Follow"}
            </button>`;
        return `
          <div class="bg-white border border-[color:var(--app-line)] rounded-2xl shadow-elev-1 p-3.5">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                ${avatarHtml(user, 44)}
                <div class="min-w-0 text-left">
                  <h3 class="font-semibold text-[14px] truncate">${user.displayName}</h3>
                  <p class="text-xs text-[color:var(--muted-foreground)] truncate">@${user.username}</p>
                  ${user.bio ? `<p class="text-[11.5px] text-[color:var(--muted-foreground)] mt-0.5 truncate">${user.bio}</p>` : ""}
                </div>
              </div>
              ${btn}
            </div>
          </div>`;
      }

      function suggestionList() {
        const me = state.currentUserId;
        const suggestions = Object.values(USERS).filter((u) => u.id !== me && !state.following.includes(u.id)).slice(0, 3);
        if (!suggestions.length) return `<div class="text-center py-8 text-sm text-[color:var(--muted-foreground)]">You've found everyone for now.</div>`;
        return suggestions.map(userRow).join("");
      }

      function tripsHeader(trips) {
        const totalCarbon = trips.reduce((s, t) => s + calcCarbonSaved(t.mode, t.km), 0);
        return `
          <header class="page-hero">
            <span class="hero-eyebrow"><i data-lucide="book-open" class="w-3 h-3"></i> Journal</span>
            <h1 class="hero-title">Your trips</h1>
            <p class="hero-subtitle">A running log of everywhere you've travelled with intent.</p>
            <div class="mt-6 rounded-2xl p-4 grid grid-cols-3 gap-3 divide-x divide-white/10"
                 style="background:hsl(0 0% 100% / .06); border:1px solid hsl(0 0% 100% / .08)">
              <div class="text-center px-2"><div class="font-display text-[26px] leading-none tabular-nums">${trips.length}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/60 mt-2">Logged</div></div>
              <div class="text-center px-2"><div class="font-display text-[26px] leading-none tabular-nums">${state.bookings.length}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/60 mt-2">Booked</div></div>
              <div class="text-center px-2"><div class="font-display text-[26px] leading-none tabular-nums">${totalCarbon.toFixed(1)}</div>
                <div class="text-[10px] uppercase tracking-wider text-white/60 mt-2">kg saved</div></div>
            </div>
          </header>`;
      }

      function labelForDate(dateKey) {
        const d = new Date(dateKey);
        const days = Math.floor((Date.now() - d.getTime()) / 86400000);
        if (days === 0) return "Today";
        if (days === 1) return "Yesterday";
        if (days < 7) return `${days} days ago`;
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      /* =================== RENDER + EVENTS =================== */
      function render() {
        const r = renderers[state.screen]; if (!r) return;
        screens.innerHTML = r();
        if (window.lucide) lucide.createIcons();
        // discover now redirects to home (they're merged), so its nav-pill maps to "home"
        const navMap = { home: "home", discover: "home", trips: "trips", profile: "profile", book: "book", log: null, rewards: null, share: null, settings: "profile" };
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.go === navMap[state.screen]));
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function go(name) {
        // Discover and Home are now the same screen
        if (name === "discover") name = "home";
        if (state.screen === name) return;
        state.screen = name; saveState(); render();
      }

      document.body.addEventListener("click", (e) => {
        // Share from a booking row — pre-fill the share form with that booking
        const shareBooking = e.target.closest("[data-share-booking]");
        if (shareBooking) {
          window._shareForm = makeShareForm("booking", +shareBooking.dataset.shareBooking);
          go("share"); return;
        }

        const nav = e.target.closest("[data-go]");
        if (nav) {
          // Reset share form when entering Share fresh (from + button)
          if (nav.dataset.go === "share" && state.screen !== "share") {
            const t = state.trips[0], b = state.bookings[0];
            window._shareForm = t ? makeShareForm("trip", t.id) : (b ? makeShareForm("booking", b.id) : makeShareForm("trip", null));
          }
          go(nav.dataset.go); return;
        }

        // Share-source pill
        const srcPill = e.target.closest(".share-source");
        if (srcPill) {
          window._shareForm = makeShareForm(srcPill.dataset.srcType, +srcPill.dataset.srcId);
          render(); return;
        }

        // Add a photo (mock — cycles through stock library)
        const addPhoto = e.target.closest("[data-photo-add]");
        if (addPhoto) {
          const i = +addPhoto.dataset.photoAdd;
          const used = new Set(window._shareForm.photos.filter(Boolean));
          const next = SHARE_STOCK_PHOTOS.find((u) => !used.has(u)) || SHARE_STOCK_PHOTOS[i % SHARE_STOCK_PHOTOS.length];
          window._shareForm.photos[i] = next;
          render(); return;
        }
        const rmPhoto = e.target.closest("[data-photo-remove]");
        if (rmPhoto) { window._shareForm.photos[+rmPhoto.dataset.photoRemove] = null; render(); return; }

        // Privacy picker
        const priv = e.target.closest("[data-privacy]");
        if (priv) { window._shareForm.privacy = priv.dataset.privacy; render(); return; }

        // Settings toggle row (notifications, digest, etc.)
        const togSet = e.target.closest("[data-toggle-setting]");
        if (togSet) {
          const map = { "set-notifications": "notifications", "set-digest": "weeklyDigest" };
          const k = map[togSet.dataset.toggleSetting];
          if (k) { state.settings[k] = !state.settings[k]; saveState(); render(); }
          return;
        }
        // Settings segmented / radio
        const segSet = e.target.closest(".setting-seg");
        if (segSet) {
          const map = {
            "set-units": "units", "set-currency": "currency", "set-theme": "theme",
            "default-privacy": "defaultPrivacy",
          };
          const k = map[segSet.dataset.setting];
          if (k) { state.settings[k] = segSet.dataset.value; saveState(); render(); }
          return;
        }
        // Settings link rows that just show a toast (placeholder sub-screens)
        const toastLink = e.target.closest("[data-toast]");
        if (toastLink && !toastLink.matches("[data-go]")) {
          toast(toastLink.dataset.toast);
          return;
        }

        // Toggles (mute + include-* details)
        const tog = e.target.closest("[data-toggle]");
        if (tog) {
          const key = tog.dataset.toggle;
          if (key === "mute") window._shareForm.mute = !window._shareForm.mute;
          else if (key.startsWith("include-")) {
            const k = key.slice("include-".length);
            window._shareForm.include[k] = !window._shareForm.include[k];
          }
          render(); return;
        }


        const likeBtn = e.target.closest(".like-btn");
        if (likeBtn) {
          const id = +likeBtn.dataset.post; const p = state.posts.find((x) => x.id === id);
          if (p) { p.liked = !p.liked; p.likeCount += p.liked ? 1 : -1; saveState(); render(); }
          return;
        }
        const followBtn = e.target.closest(".follow-btn");
        if (followBtn) {
          const id = +followBtn.dataset.user; const idx = state.following.indexOf(id);
          if (idx === -1) { state.following.push(id); const u = Object.values(USERS).find((x) => x.id === id); toast(`Following ${u.displayName}`); }
          else state.following.splice(idx, 1);
          saveState(); render(); return;
        }
        const modeBtn = e.target.closest(".mode-btn");
        if (modeBtn) { window._logForm.mode = modeBtn.dataset.mode; render(); return; }
        const popular = e.target.closest(".popular-route");
        if (popular) { window._bookForm = { fromId: popular.dataset.from, toId: popular.dataset.to, when: window._bookForm?.when || "" }; render(); return; }
        const searchBtn = e.target.closest("#book-search");
        if (searchBtn) {
          // Resolve whatever is typed in the From / To fields, then show ranked routes
          const fromEl = document.getElementById("book-from");
          const toEl   = document.getElementById("book-to");
          const whenEl = document.getElementById("book-when");
          const fromCity = fromEl ? cityByLabel(fromEl.value) : null;
          const toCity   = toEl ? cityByLabel(toEl.value) : null;
          window._bookForm = window._bookForm || { fromId: "", toId: "", when: "" };
          if (whenEl) window._bookForm.when = whenEl.value;
          if (!fromCity || !toCity) {
            toast("Pick a city for both From and To");
            return;
          }
          if (fromCity.id === toCity.id) { toast("Choose two different cities"); return; }
          window._bookForm.fromId = fromCity.id;
          window._bookForm.toId   = toCity.id;
          saveState(); render();
          // Scroll to the ranked options once they render
          requestAnimationFrame(() => {
            const opts = document.querySelector('.book-option');
            if (opts) opts.scrollIntoView({ behavior: "smooth", block: "center" });
          });
          return;
        }
        const bookOpt = e.target.closest(".book-option");
        if (bookOpt) { bookTrip(bookOpt.dataset.mode); return; }
        const cancelBooking = e.target.closest(".cancel-booking");
        if (cancelBooking) {
          const id = +cancelBooking.dataset.booking; const idx = state.bookings.findIndex((b) => b.id === id);
          if (idx > -1) { const b = state.bookings[idx]; state.bookings.splice(idx, 1); state.points = Math.max(0, state.points - b.points);
            toast(`Booking cancelled (−${formatPoints(b.points)} pts)`); saveState(); render(); }
          return;
        }
        const discoverTab = e.target.closest(".discover-tab");
        if (discoverTab) { state.discoverFilter = discoverTab.dataset.discover; saveState(); render(); return; }
        const rewardFilter = e.target.closest(".reward-filter");
        if (rewardFilter) { state.rewardFilter = rewardFilter.dataset.filter; saveState(); render(); return; }
        const redeemBtn = e.target.closest(".redeem-btn");
        if (redeemBtn && !redeemBtn.disabled) {
          const r = rewardById(redeemBtn.dataset.reward); if (!r) return;
          if (state.points < r.cost) { toast("Not enough EcoPoints"); return; }
          if (!r.repeatable && state.redemptions.some((x) => x.rewardId === r.id)) { toast("Already claimed"); return; }
          if (!confirm(`Redeem "${r.name}" for ${formatPoints(r.cost)} EcoPoints?`)) return;
          state.points -= r.cost;
          state.redemptions.push({ id: Date.now(), rewardId: r.id, cost: r.cost, when: new Date().toISOString() });
          toast(`Redeemed "${r.name}"`); saveState(); render(); return;
        }
        const hotelBtn = e.target.closest("[data-hotel]");
        if (hotelBtn) {
          const h = ECO_HOTELS.find((x) => x.id === +hotelBtn.dataset.hotel);
          if (h) toast(`Reserved at ${h.name} — confirmation sent`);
          return;
        }
        const challengeBtn = e.target.closest(".challenge-toggle");
        if (challengeBtn) {
          const id = challengeBtn.dataset.challenge;
          const idx = state.activeChallenges.indexOf(id);
          if (idx === -1) { state.activeChallenges.push(id); toast("Challenge started — good luck!"); }
          else { state.activeChallenges.splice(idx, 1); toast("Challenge ended"); }
          saveState(); render(); return;
        }
        if (e.target.closest("[data-share-post]")) {
          const f = window._shareForm || {};
          if (!(f.body?.trim() || f.title?.trim())) { toast("Add a title or a few words"); return; }
          const src = resolveShareSource(f);
          state.posts.unshift({
            id: Date.now(),
            userId: state.currentUserId,
            title: f.title?.trim() || null,
            body:  f.body?.trim()  || "",
            tripId:    f.sourceType === "trip"    ? f.sourceId : null,
            bookingId: f.sourceType === "booking" ? f.sourceId : null,
            ecoScore: src?.ecoScore ?? null,
            include: { ...f.include },
            privacy: f.privacy || "public",
            mute: !!f.mute,
            image: f.photos?.find(Boolean) || null,
            likeCount: 0, liked: false,
            when: new Date().toISOString(),
          });
          window._shareForm = null; saveState();
          toast("Posted to your feed"); go("home"); return;
        }
      });

      document.body.addEventListener("input", (e) => {
        const id = e.target.id;
        if (id === "from") window._logForm.from = e.target.value;
        if (id === "to")   window._logForm.to   = e.target.value;
        if (id === "km") { window._logForm.km = e.target.value; rerenderPreservingFocus(); }
        if (id === "book-from" || id === "book-to") {
          const c = cityByLabel(e.target.value);
          const key = id === "book-from" ? "fromId" : "toId";
          if (c) { window._bookForm[key] = c.id; rerenderPreservingFocus(); }
          else if (window._bookForm[key]) { window._bookForm[key] = ""; rerenderPreservingFocus(); }
        }
        if (id === "book-when") window._bookForm.when = e.target.value;
        if (id === "search-input") doSearch(e.target.value);
        if (id === "share-body"  && window._shareForm) window._shareForm.body = e.target.value;
        if (id === "share-title" && window._shareForm) window._shareForm.title = e.target.value;
        if (id === "set-goal") { state.settings.monthlyGoal = +e.target.value; saveState(); render(); }
      });

      function rerenderPreservingFocus() {
        const focusId = document.activeElement?.id;
        const caret = document.activeElement?.selectionStart;
        const scroll = window.scrollY;
        render();
        window.scrollTo(0, scroll);
        const again = focusId && document.getElementById(focusId);
        if (again) { again.focus(); if (caret != null) try { again.setSelectionRange(caret, caret); } catch (e) {} }
      }

      document.body.addEventListener("submit", (e) => {
        if (e.target.id !== "log-form") return;
        e.preventDefault();
        const f = window._logForm; const km = parseFloat(f.km);
        if (!f.from.trim() || !f.to.trim() || !(km > 0)) { toast("Fill in From, To, and Distance"); return; }
        state.trips.unshift({ id: Date.now(), mode: f.mode, from: f.from.trim(), to: f.to.trim(), km, date: new Date().toISOString() });
        const saved = calcCarbonSaved(f.mode, km); saveState();
        window._logForm = { mode: "cycling", from: "", to: "", km: "" };
        toast(`Trip logged — ${saved.toFixed(1)} kg CO₂ avoided`); go("home");
      });

      function bookTrip(modeKey) {
        const f = window._bookForm;
        const from = cityById(f.fromId); const to = cityById(f.toId);
        if (!from || !to) { toast("Pick a From and a To from the list"); return; }
        if (from.id === to.id) { toast("Pick two different cities"); return; }
        const opt = optionsForRoute(from, to).find((o) => o.key === modeKey);
        if (!opt) { toast("That option isn't available for this route"); return; }
        state.bookings.unshift({
          id: Date.now(), mode: opt.key, service: opt.service || null,
          from: from.name, to: to.name, km: opt.km, points: opt.points, co2: opt.co2,
          durationH: opt.durationH || estimateDuration(opt.key, opt.km),
          when: f.when ? new Date(f.when).toISOString() : daysFromNow(7),
          status: "booked",
        });
        state.points += opt.points; saveState();
        window._bookForm = { fromId: "", toId: "", when: "" };
        const via = opt.service ? ` via ${opt.service}` : "";
        toast(`Booked ${from.name} → ${to.name}${via} · +${formatPoints(opt.points)} pts`);
        go("home");
      }

      function doSearch(q) {
        const sec = $("#search-results-section"); const sug = $("#suggestions-section"); const out = $("#search-results");
        if (!sec || !sug || !out) return;
        const term = q.trim().toLowerCase();
        if (term.length < 2) { sec.style.display = "none"; sug.style.display = "block"; return; }
        sec.style.display = "block"; sug.style.display = "none";
        const matches = Object.values(USERS).filter((u) => u.id !== state.currentUserId &&
          (u.displayName.toLowerCase().includes(term) || u.username.toLowerCase().includes(term)));
        out.innerHTML = matches.length ? matches.map(userRow).join("") : `<div class="text-center py-8 text-sm text-[color:var(--muted-foreground)]">No matches.</div>`;
        if (window.lucide) lucide.createIcons();
      }

      window.resetData = function () {
        if (confirm("Clear all trips, bookings and points?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
      };

      render();
    </script>
  </body>
</html>
