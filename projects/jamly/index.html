.grain{
  position:absolute; inset:0; pointer-events:none;
  background-image:
    radial-gradient(circle at 25% 18%, rgba(255,200,150,.012) 0, transparent 1px),
    radial-gradient(circle at 78% 62%, rgba(255,200,150,.014) 0, transparent 1px),
    radial-gradient(circle at 38% 84%, rgba(255,200,150,.01) 0, transparent 1px);
  background-size: 3px 3px, 5px 5px, 4px 4px;
  mix-blend-mode: overlay;
  opacity:.6;
}

/* motion primitives \u2014 slower, more considered */
.pin-dot{ transition:transform .22s cubic-bezier(.34,1.56,.64,1), filter .2s; cursor:pointer }
.pin-dot:hover{ filter:brightness(1.25) }
.pin-pulse{ animation: pp 3s ease-in-out infinite }
@keyframes pp{ 0%,100%{ opacity:.32; transform:scale(1) } 50%{ opacity:.04; transform:scale(2.4) } }

.sheet-enter{ animation: su .32s cubic-bezier(.22,1,.36,1) forwards }
@keyframes su{ from{ transform:translateY(100%); opacity:0 } to{ transform:translateY(0); opacity:1 } }

.sc-enter{ animation: scIn .26s ease forwards }
@keyframes scIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:translateY(0) } }

@keyframes toastIn{ from{ opacity:0; transform:translate(-50%, 8px) } to{ opacity:1; transform:translate(-50%, 0) } }

.fade-up{ animation: fu .42s cubic-bezier(.22,1,.36,1) both }
@keyframes fu{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:translateY(0) } }

/* tags & chips */
.tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; letter-spacing:.005em }

/* nav */
.nav-item{ cursor:pointer; transition:opacity .15s }
.nav-item:active{ opacity:.5 }

/* buttons */
.fbtn{ cursor:pointer; border:none; outline:none; transition:background .18s, color .18s, transform .12s, border-color .18s }
.fbtn:active{ transform:scale(.98) }

/* discovery reel */
.reel-track{ will-change:transform; transition:transform .42s cubic-bezier(.22,1,.36,1) }
.reel-overlay{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 48%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.92) 100%); pointer-events:none }
.side-action{ display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; transition:transform .15s }
.side-action:active{ transform:scale(.82) }
.progress-bar{ height:1.5px; border-radius:2px; background:rgba(244,236,222,.2); flex:1; overflow:hidden }
.progress-fill{ height:100%; border-radius:2px; background:#f4ecde; transition:width .3s ease }
.avatar-ring{ box-shadow:0 0 0 1.5px rgba(0,0,0,.55) }

/* sheet */
.prow{ cursor:pointer; border-radius:12px; transition:background .18s }
.prow:hover{ background:var(--surface-2) !important }
.bottom-sheet{ position:absolute; bottom:0; left:0; right:0; background:var(--surface); border-radius:24px 24px 0 0; border-top:1px solid var(--hairline-2); z-index:40; max-height:78%; display:flex; flex-direction:column }

/* Riffs \u2014 vertical snap scroll */
.riffs-track { display:flex; flex-direction:column; flex:1; min-height:0; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.riffs-track > div { width:100%; height:100%; min-height:100%; flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative; }
.riffs-track::-webkit-scrollbar { display:none; }
.bsIn{ animation: bsAnim .32s cubic-bezier(.22,1,.36,1) forwards }
@keyframes bsAnim{ from{ transform:translateY(100%) } to{ transform:translateY(0) } }

/* GPS modal */
.gps-ping{ animation: gps 1.8s ease-out infinite }
@keyframes gps{ 0%{ transform:scale(.4); opacity:.65 } 100%{ transform:scale(2.8); opacity:0 } }
.gps-rotate{ animation: gpsR 8s linear infinite }
@keyframes gpsR{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
.dot-pulse{ animation: dp 1.6s ease-in-out infinite }
@keyframes dp{ 0%,100%{ opacity:.32 } 50%{ opacity:.95 } }
.success-pop{ animation: sp .55s cubic-bezier(.34,1.56,.64,1) both }
@keyframes sp{ 0%{ opacity:0; transform:scale(.6) } 100%{ opacity:1; transform:scale(1) } }

/* form */
.input-field{
  width:100%; background:var(--bg-2); border:1px solid var(--hairline-2); border-radius:12px;
  padding:12px 14px; color:var(--ink); font-size:13.5px; font-family:'DM Sans',sans-serif;
  outline:none; transition:border-color .18s, background .18s;
}
.input-field:focus{ border-color:var(--accent); background:var(--surface) }
.input-field::placeholder{ color:var(--ink-5) }

.chip{
  cursor:pointer; padding:7px 13px; border-radius:20px; font-size:11.5px; font-weight:500;
  letter-spacing:.005em; transition:all .18s; border:1px solid var(--hairline-2);
  background:var(--bg-2); color:var(--ink-3);
}
.chip:hover{ color:var(--ink-2); border-color:var(--border) }
.chip-active{ background:var(--accent); border-color:var(--accent); color:#fff }

.type-card{ cursor:pointer; transition:all .22s; border:1px solid var(--hairline-2); background:var(--surface) }
.type-card:hover{ border-color:var(--border) }
.type-card-active{ border-color:var(--accent); background:linear-gradient(135deg, rgba(255,87,51,.06), rgba(255,87,51,.02)); box-shadow:0 8px 30px rgba(255,87,51,.12) }

/* tabs */
.tab-pill{ cursor:pointer; transition:all .2s }
.tab-pill:hover{ background:var(--surface-2) }

/* event row */
.event-row{ cursor:pointer; transition:background .18s, border-color .18s }
.event-row:hover{ background:var(--surface-2); border-color:var(--border) }

/* sparkle for unlocks */
.sparkle{ animation: sk 2.4s ease-in-out infinite }
@keyframes sk{ 0%,100%{ opacity:.4; transform:scale(.85) } 50%{ opacity:1; transform:scale(1.1) } }

/* faint shimmer on industry-pulse number */
.shimmer-num{
  background:linear-gradient(90deg, var(--ink) 0%, var(--warm) 40%, var(--ink) 80%);
  background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: shim 4s ease-in-out infinite;
}
@keyframes shim{ 0%,100%{ background-position:0% 0% } 50%{ background-position:100% 0% } }

/* hairline divider */
.hr-soft{ height:1px; background:linear-gradient(to right, transparent, var(--hairline-2), transparent) }

/* Real Milan map \u2014 custom pin styles (used over OSM tiles) */
.jamly-pin-marker{ background:transparent; border:none; outline:none; }
.jamly-pin-marker{ cursor:pointer; }
.jamly-pin-wrap{ position:relative; width:22px; height:22px; cursor:pointer; }
.jamly-pin-pulse{ position:absolute; inset:0; border-radius:50%; opacity:.18; animation:pp 3s ease-in-out infinite; }
.jamly-pin-core{
  position:absolute; inset:6px; border-radius:50%;
  border:1.5px solid rgba(244,236,222,.92);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.40), 0 0 0 1px rgba(0,0,0,.10);
  transition:transform .2s;
}
.jamly-pin-marker:hover{ z-index:5; }
.jamly-pin-marker:hover .jamly-pin-core{ transform:scale(1.4); }

/* Apple Maps "you are here" \u2014 iOS blue dot with pulsing halo + ring */
.apple-loc-wrap{ position:relative; width:60px; height:60px; }
/* Soft outer halo \u2014 gradient fade */
.apple-loc-halo{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle, rgba(0,122,255,.28) 0%, rgba(0,122,255,.12) 40%, rgba(0,122,255,0) 70%);
}
/* Animated pulse ring */
.apple-loc-pulse{
  position:absolute; inset:14px; border-radius:50%;
  background:rgba(0,122,255,.55);
  animation:locPulse 2.4s cubic-bezier(.4,0,.6,1) infinite;
  transform-origin:center;
}
@keyframes locPulse{
  0%   { transform:scale(.55); opacity:.85 }
  85%  { transform:scale(1.7); opacity:0   }
  100% { transform:scale(1.7); opacity:0   }
}
/* White ring around dot */
.apple-loc-ring{
  position:absolute; inset:18px; border-radius:50%;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06);
}
/* Solid blue dot in center */
.apple-loc-dot{
  position:absolute; inset:21px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #4DA3FF 0%, #007AFF 60%, #0066D6 100%);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.15);
}
